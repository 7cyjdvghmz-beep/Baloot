<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بلوت">
<meta name="theme-color" content="#0a3d26">
<title>بلوت — Saudi Baloot</title>
<style>
  :root{
    --sand:#d6c09a; --sand-d:#c4ac82;
    --rug-frame:#cdaa78; --rug-red:#a8362a; --rug-red2:#92291f;
    --green:#3b7a4f; --gold:#d8a93a; --purple:#5b4a78;
    --gold-l:#e9c46a; --gold-deep:#8a6d2f;
    --us:#2e8b57; --them:#b5482f;
    --card-bg:#fbf7ec; --red:#c0392b; --blk:#1b1b1b;
    --plate:#b89968; --plate-d:#8f7547;
    --bar:#caa84a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font-family:"Tahoma","Segoe UI",system-ui,sans-serif;color:#23180c;
    background:radial-gradient(120% 120% at 50% 40%, #2a2620 0%, #15120d 100%);
    touch-action:manipulation;display:flex;align-items:center;justify-content:center;}
  /* phone frame: fills a real phone, shows a centered phone-width column on desktop */
  #app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;max-height:932px;margin:auto;
    display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 40%, var(--sand) 0%, var(--sand-d) 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.3),0 14px 55px rgba(0,0,0,.5);}

  /* ---------- Top bar ---------- */
  #topbar{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:8px 8px 4px;flex-wrap:nowrap;}
  .tb{background:linear-gradient(180deg,#6f6f6f,#4a4a4a);color:#f4f0e6;border:1px solid #2c2c2c;
    border-radius:11px;padding:8px 9px;font-size:11px;font-weight:700;text-align:center;line-height:1.15;
    box-shadow:0 2px 4px rgba(0,0,0,.35);min-width:42px;}
  .tb small{display:block;font-size:9px;opacity:.8;}
  #scorebox{background:linear-gradient(180deg,#5a5a5a,#3a3a3a);border-radius:13px;padding:5px 8px 7px;border:1px solid #222;}
  .sc-row{display:flex;gap:6px;}
  .sc{background:#1c1c1c;border-radius:9px;padding:3px 14px;text-align:center;min-width:54px;}
  .sc .h{font-size:9px;color:#cfc6b2;}
  .sc .v{font-size:20px;font-weight:800;}
  .sc.us .v{color:#7be0a6;} .sc.them .v{color:#f0a48d;}
  #scorebox .sess{text-align:center;color:#cfc6b2;font-size:10px;margin-top:2px;}

  /* ---------- Table ---------- */
  #table{flex:1;position:relative;z-index:1;}
  #rug{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
    width:min(80vw,340px);height:min(90vw,392px);border-radius:10px;
    background:var(--rug-frame);
    box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 0 2px rgba(120,80,40,.4);}
  /* diamond border pattern on frame */
  #rug::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:
      repeating-linear-gradient(45deg, var(--rug-red) 0 5px, transparent 5px 16px),
      repeating-linear-gradient(-45deg, var(--rug-red) 0 5px, transparent 5px 16px);
    opacity:.5;mix-blend-mode:multiply;}
  #rugfield{position:absolute;inset:24px;border-radius:5px;overflow:hidden;
    background:linear-gradient(180deg,var(--rug-red) 0%,var(--rug-red2) 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);}
  /* sadu horizontal bands + zigzags */
  #rugfield::before{content:"";position:absolute;inset:0;opacity:.92;
    background:
      linear-gradient(0deg, transparent 0 6%, var(--gold) 6% 8.5%, transparent 8.5% 12%),
      linear-gradient(0deg, transparent 0 18%, var(--green) 18% 20%, transparent 20% 23%),
      linear-gradient(0deg, transparent 0 78%, var(--green) 78% 80%, transparent 80% 83%),
      linear-gradient(0deg, transparent 0 89%, var(--gold) 89% 91.5%, transparent 91.5% 95%);}
  #rugfield::after{content:"";position:absolute;left:0;right:0;height:26px;top:30%;opacity:.8;
    background:
      conic-gradient(from 135deg at 50% 0, var(--gold) 0 25%, transparent 0 50%, var(--gold) 0 75%, transparent 0);
    background-size:30px 26px;background-repeat:repeat-x;
    -webkit-mask:linear-gradient(#000,#000);}

  /* center play zone */
  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:184px;height:200px;z-index:8;pointer-events:none;}
  .play{position:absolute;transition:transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s;}
  #play-S{bottom:0;left:50%;transform:translateX(-50%) rotate(2deg);}
  #play-N{top:0;left:50%;transform:translateX(-50%) rotate(-2deg);}
  #play-E{left:6px;top:50%;transform:translateY(-50%) rotate(-8deg);}
  #play-W{right:6px;top:50%;transform:translateY(-50%) rotate(8deg);}
  #buyer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;}

  /* ---------- Seats / plates ---------- */
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;width:118px;z-index:12;}
  .avatar{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe7d4,#b9ad93);
    border:3px solid var(--plate);display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 3px 8px rgba(0,0,0,.35);position:relative;transition:.2s;}
  .seat.active .avatar{border-color:var(--gold-l);box-shadow:0 0 0 3px rgba(216,169,58,.45),0 0 16px rgba(216,169,58,.55);}
  .timer{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--gold-l);display:none;
    align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;
    background:rgba(40,40,40,.55);}
  .seat.active .timer{display:flex;}
  .plate{margin-top:-8px;background:linear-gradient(180deg,#e7d9bb,#c9b58c);border:1px solid var(--plate-d);
    border-radius:9px;padding:8px 12px 5px;min-width:92px;text-align:center;box-shadow:0 3px 7px rgba(0,0,0,.3);}
  .plate .rk{font-size:11px;color:#5a4626;font-weight:700;line-height:1;}
  .plate .bar{height:4px;width:64px;margin:4px auto 4px;border-radius:3px;background:#9a875f;overflow:hidden;}
  .plate .bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#b5482f,#d8a93a);}
  .plate .nm{font-size:11px;font-weight:800;color:#2c2113;background:#f3ead2;border-radius:6px;padding:1px 7px;
    display:inline-block;line-height:1.3;}
  .badges{margin-top:3px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:8px;line-height:1.2;white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .badge.dealer{background:#f2d44d;color:#3a2c00;display:none;}
  .badge.contract{background:#fff;color:#1b1b1b;border:1px solid #d8c79a;display:none;}
  .badge.contract .rs{color:var(--red);}
  .badge.project{background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;display:none;}

  #seat-N{top:4px;left:50%;transform:translateX(-50%);}
  #seat-E{top:46%;left:2px;transform:translateY(-50%);}
  #seat-W{top:46%;right:2px;transform:translateY(-50%);}
  #seat-S{bottom:2px;left:50%;transform:translateX(-50%);}
  #seat-S .plate{margin-top:-6px;}

  /* opponent fanned backs */
  .fan{position:absolute;display:flex;z-index:9;}
  #fan-N{top:64px;left:50%;transform:translateX(-50%);}
  #fan-E{top:50%;left:60px;transform:translateY(-50%);transform-origin:center;}
  #fan-W{top:50%;right:60px;transform:translateY(-50%);transform-origin:center;}
  .miniback{width:30px;height:42px;border-radius:5px;margin-inline-start:-19px;
    background:repeating-linear-gradient(45deg,#9c2b22 0 4px,#7e221b 4px 8px);
    border:1.5px solid #e7d3a0;box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative;}
  .miniback:first-child{margin-inline-start:0;}
  .miniback::after{content:"";position:absolute;inset:5px;border:1px solid rgba(231,211,160,.5);border-radius:3px;}

  /* project reveal (near the owner, not center) */
  .proj{position:absolute;z-index:11;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .proj .ptag{background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;
    font-size:10px;font-weight:800;padding:1px 8px;border-radius:7px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
  .proj .pfan{display:flex;}
  .proj .pfan .card{width:30px;height:44px;margin-inline-start:-9px;box-shadow:0 2px 5px rgba(0,0,0,.45);}
  .proj .pfan .card:first-child{margin-inline-start:0;}
  #proj-N{top:122px;left:50%;transform:translateX(-50%);}
  #proj-S{bottom:6px;left:14px;}
  #proj-E{top:40%;left:84px;transform:translateY(-50%);}
  #proj-W{top:40%;right:84px;transform:translateY(-50%);}

  /* speech bubble */
  .bubble{position:absolute;background:#2b2b2b;color:var(--gold-l);font-weight:800;font-size:14px;
    padding:5px 13px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.4);
    opacity:0;transform:scale(.7);transition:.18s;pointer-events:none;z-index:40;}
  .bubble.show{opacity:1;transform:scale(1);}

  /* ---------- Cards ---------- */
  .card{background:var(--card-bg);border-radius:8px;box-shadow:0 3px 7px rgba(0,0,0,.4);
    border:1px solid rgba(0,0,0,.12);position:relative;overflow:hidden;font-size:16px;}
  .card.red{color:var(--red);} .card.blk{color:var(--blk);}
  .card.face{background-repeat:no-repeat;background-size:800% 400%;background-color:#fbf7ec;}
  .corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.92;font-weight:800;}
  .corner.tl{top:3px;left:4px;} .corner.br{bottom:3px;right:4px;transform:rotate(180deg);}
  .corner .cr{font-size:.9em;} .corner .cs{font-size:.7em;margin-top:-1px;}
  .pips{position:absolute;left:16%;right:16%;top:12%;bottom:12%;}
  .pip{position:absolute;transform:translate(-50%,-50%);font-size:.62em;line-height:1;}
  .pip.inv{transform:translate(-50%,-50%) rotate(180deg);}
  .court{position:absolute;inset:13% 10%;border:1.5px solid currentColor;border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.96;
    background:linear-gradient(180deg,rgba(216,169,58,.16),rgba(168,54,42,.1));}
  .court .cl{font-size:2em;font-weight:900;line-height:1;}
  .court .cf{font-size:1.1em;margin-top:1px;}
  .court .pic{font-size:1.5em;line-height:1;filter:grayscale(.15);}
  .card.back{background:repeating-linear-gradient(45deg,#9c2b22 0 5px,#7e221b 5px 10px);border:2px solid #e7d3a0;}
  .card.back::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(231,211,160,.55);border-radius:5px;
    background:radial-gradient(circle,rgba(231,211,160,.25),transparent 60%);}

  /* sizes */
  #hand .card{width:66px;height:100px;font-size:19px;margin-left:-26px;transform-origin:50% 155%;
    transform:translateY(var(--arcY,0px)) translateY(var(--pressY,0px)) rotate(var(--rot,0deg));}
  #hand .card:first-child{margin-left:0;}
  .play .card{width:54px;height:80px;font-size:15px;}
  #buyer .card{width:50px;height:74px;font-size:14px;}

  /* ---------- Hand ---------- */
  #hand-wrap{padding:4px 4px 8px;position:relative;z-index:3;}
  .proj{pointer-events:none;}
  body.editing .proj{pointer-events:auto;}
  .seat .ailvl{font-size:8.5px;font-weight:800;color:#ffd97a;background:rgba(0,0,0,.42);padding:1px 7px;border-radius:7px;margin-top:1px;letter-spacing:.2px;}
  #handname{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:2px;}
  .mini-btn{background:linear-gradient(180deg,#e9ddc2,#cdbb92);color:#2c2113;border:1px solid #a7935f;
    border-radius:9px;font-size:11px;font-weight:800;padding:4px 11px;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .mini-btn.on{background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;}
  #hand .arrcard{transform:none!important;margin:0!important;border:1px solid rgba(0,0,0,.15);
    box-shadow:0 2px 6px rgba(0,0,0,.4);}
  #hand .arrcard.dragging{transform:scale(1.07)!important;box-shadow:0 9px 20px rgba(0,0,0,.55);}
  /* layout editor */
  body.editing .movable{outline:2px dashed var(--gold-l);outline-offset:-2px;}
  body.editing .movable.moving{outline:2px solid #fff;}
  body.editing .proj.selp{outline:2px solid #4fd1ff;box-shadow:0 0 10px rgba(79,209,255,.5);}
  body.editing .fan{min-width:64px;min-height:50px;background:rgba(255,255,255,.04);border-radius:8px;}
  body.editing #hand .card{pointer-events:none;}
  body.editing #actionbar .abtn{pointer-events:none;}
  #editbar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:200;display:none;gap:6px;align-items:center;
    flex-wrap:wrap;justify-content:center;max-width:94vw;
    background:rgba(20,12,4,.88);padding:6px 9px;border-radius:13px;border:1px solid var(--gold-deep);box-shadow:0 6px 18px rgba(0,0,0,.5);}
  body.editing #editbar{display:flex;}
  #editbar .eb-title{color:var(--gold-l);font-size:12px;font-weight:800;}
  #editbar button{border:none;border-radius:9px;font-weight:800;font-size:12px;padding:6px 10px;color:#241a06;
    background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));}
  #editbar #edit-reset{background:#cdbb92;}
  #handname .nm{background:#cfbf98;color:#2c2113;font-weight:800;font-size:12px;padding:3px 12px;border-radius:9px;}
  #hand{display:flex;direction:ltr;justify-content:center;align-items:flex-end;min-height:118px;padding-top:10px;}
  #hand .card{transition:transform .18s ease-out, box-shadow .18s ease-out;}
  #hand .card.lift{--pressY:-34px;z-index:60;box-shadow:0 8px 16px rgba(0,0,0,.4);}
  #hand .card.lift{--pressY:-40px;z-index:60;box-shadow:0 8px 16px rgba(0,0,0,.45);}
  #hand .card.dim{opacity:.42;filter:grayscale(.5);}

  /* ---------- Bid / action bar (bottom) ---------- */
  #actionbar{display:flex;gap:8px;padding:6px 10px 12px;justify-content:center;}
  .abtn{flex:1;max-width:150px;background:linear-gradient(180deg,#e9ddc2,#cdbb92);border:1px solid #a7935f;
    border-radius:13px;padding:13px 8px;font-size:16px;font-weight:800;color:#2c2113;
    box-shadow:0 3px 7px rgba(0,0,0,.28);cursor:pointer;transition:.1s;}
  .abtn:active{transform:translateY(2px);}
  .abtn.gold{background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;}
  .abtn .rs{color:var(--red);}

  /* ---------- Modal / toast ---------- */
  #modal{position:fixed;inset:0;background:rgba(20,12,4,.6);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  #modal.show{display:flex;}
  .sheet{width:100%;max-width:380px;background:linear-gradient(180deg,#efe2c6,#d7c39a);
    border:2px solid var(--gold-deep);border-radius:20px;padding:20px;color:#2c2113;
    box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center;}
  .sheet h2{margin:0 0 4px;color:#5a3d12;font-size:20px;}
  .sheet p{margin:0 0 14px;font-size:13px;opacity:.85;}
  .btn-row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
  .btn{flex:1;min-width:90px;padding:13px 10px;border-radius:13px;border:none;font-weight:800;font-size:15px;
    background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;
    box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;}
  .btn:active{transform:translateY(2px);}
  .btn.ghost{background:#cdbb92;color:#2c2113;border:1px solid #a7935f;}
  #toast{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.8);
    background:linear-gradient(180deg,var(--gold-l),var(--gold-deep));color:#241a06;
    font-weight:900;font-size:20px;padding:12px 26px;border-radius:16px;z-index:90;
    opacity:0;transition:.22s;box-shadow:0 8px 22px rgba(0,0,0,.5);pointer-events:none;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1);}
  #toast small{display:block;font-size:12px;font-weight:700;opacity:.85;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb">⋯<small>المزيد</small></div>
    <div class="tb" id="dbg-btn">🐞<small>تدقيق</small></div>
    <div class="tb" id="snd-btn">🔊<small>الصوت</small></div>
    <div class="tb" id="view-btn">🪑<small>مقعدي</small></div>
    <div id="scorebox">
      <div class="sc-row">
        <div class="sc them"><div class="h">لهم</div><div class="v" id="score-them">0</div></div>
        <div class="sc us"><div class="h">لنا</div><div class="v" id="score-us">0</div></div>
      </div>
      <div class="sess">جلسة ٦٠٠٣ · إلى ١٥٢</div>
    </div>
    <div class="tb">⤴<small>مشاركة</small></div>
    <div class="tb">☺<small>تعابير</small></div>
  </div>

  <div id="table">
    <div id="rug"><div id="rugfield"></div></div>

    <div class="fan" id="fan-N"></div>
    <div class="fan" id="fan-E"></div>
    <div class="fan" id="fan-W"></div>

    <div class="proj" id="proj-N"></div>
    <div class="proj" id="proj-E"></div>
    <div class="proj" id="proj-W"></div>
    <div class="proj" id="proj-S"></div>

    <div id="center">
      <div class="play" id="play-N"></div>
      <div class="play" id="play-E"></div>
      <div class="play" id="play-W"></div>
      <div class="play" id="play-S"></div>
      <div id="buyer"></div>
    </div>

    <!-- seats -->
    <div class="seat" id="seat-N">
      <div class="avatar">🙂<div class="timer">10</div></div>
      <div class="plate"><div class="rk">مبتدئ</div><div class="bar"><i></i></div><div class="nm" data-nm></div></div>
      <div class="badges"><div class="badge dealer">الموزع</div><div class="badge contract"></div><div class="badge project"></div></div>
    </div>
    <div class="seat" id="seat-E">
      <div class="avatar">🙂<div class="timer">10</div></div>
      <div class="plate"><div class="rk">مبتدئ</div><div class="bar"><i></i></div><div class="nm" data-nm></div></div>
      <div class="badges"><div class="badge dealer">الموزع</div><div class="badge contract"></div><div class="badge project"></div></div>
    </div>
    <div class="seat" id="seat-W">
      <div class="avatar">🙂<div class="timer">10</div></div>
      <div class="plate"><div class="rk">مبتدئ</div><div class="bar"><i></i></div><div class="nm" data-nm></div></div>
      <div class="badges"><div class="badge dealer">الموزع</div><div class="badge contract"></div><div class="badge project"></div></div>
    </div>
    <div class="seat" id="seat-S">
      <div class="avatar">😎<div class="timer">10</div></div>
      <div class="plate"><div class="rk">مبتدئ</div><div class="bar"><i></i></div><div class="nm" data-nm></div></div>
      <div class="badges"><div class="badge dealer">الموزع</div><div class="badge contract"></div><div class="badge project"></div></div>
    </div>

    <div class="bubble" id="bub-N"></div>
    <div class="bubble" id="bub-E"></div>
    <div class="bubble" id="bub-W"></div>
    <div class="bubble" id="bub-S"></div>
  </div>

  <div id="hand-wrap">
    <div id="handname"><span class="nm">Mshari1122</span><button id="arrange-btn" class="mini-btn">↕ ترتيب</button><button id="layout-btn" class="mini-btn">🎛 تصميم</button></div>
    <div id="hand"></div>
  </div>

  <div id="actionbar"></div>
</div>

<div id="editbar">
  <span id="eb-grip" style="color:#cdbb92;font-size:16px;cursor:grab;user-select:none;padding:4px 6px;touch-action:none;">✥</span>
  <button id="edit-reset">إرجاع</button>
  <button id="proj-sel">اختر مشروع</button>
  <button id="proj-minus">حجم −</button>
  <button id="proj-plus">حجم +</button>
  <button id="proj-close">قرّب</button>
  <button id="proj-spread">باعد</button>
  <button id="proj-tiltm">ميل −</button>
  <button id="proj-tiltp">ميل +</button>
  <button id="proj-rotm">تدوير ⟲</button>
  <button id="proj-rotp">تدوير ⟳</button>
  <button id="hand-minus">ورقي −</button>
  <button id="hand-plus">ورقي +</button>

function pickVoice(){
  if(VOICE_PICK||VOICE_TRIED)return VOICE_PICK;
  let vs=[];try{vs=window.speechSynthesis.getVoices()||[];}catch(e){}
  if(!vs.length)return null;                 // list not ready yet; retry later
  VOICE_TRIED=true;
  const ar=vs.filter(v=>/^ar/i.test(v.lang||''));

  const score=v=>{
    const n=(v.name||'').toLowerCase();let s=0;
    if(/enhanced|premium|siri|neural|wavenet/.test(n))s+=6;   // higher-quality engines
    if(/maged|tarik|laila|mariam|hoda|salim|zeina/.test(n))s+=3;

    if(/ar[-_]?(ae|kw|bh|qa|om)/i.test(v.lang||''))s+=2;      // other Gulf
    if(v.localService)s+=1;
    return s;};
  ar.sort((a,b)=>score(b)-score(a));
  return (VOICE_PICK=ar[0]);
}

const CLIP_CACHE={};
function clipUrl(key){
  if(!CLIPS[key])return null;
  if(CLIP_CACHE[key])return CLIP_CACHE[key];
  // data: URI is the most reliable source on iOS Safari (blob: URLs can fail there)
  return (CLIP_CACHE[key]='data:audio/mpeg;base64,'+CLIPS[key]);
}
let CLIP_AUDIO=null,CLIP_QUEUE=[],CLIP_BUSY=false;

// reused <audio> element plays far more reliably than creating one per clip.
let AUDIO_EL=null,AUDIO_UNLOCKED=false,AUDIO_CTX=null;
function audioEl(){
  if(!AUDIO_EL){

    AUDIO_EL.preload='auto';
    AUDIO_EL.playsInline=true;
    try{AUDIO_EL.setAttribute('playsinline','');AUDIO_EL.setAttribute('webkit-playsinline','');}catch(e){}
  }
  return AUDIO_EL;
}

    // 2) prime the shared <audio> element with a silent play inside this gesture
    const a=audioEl();
    a.muted=true;
    a.src=clipUrl('bas')||clipUrl('sun')||'';
    const p=a.play();
    if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.muted=false;window.AUDIO_DIAG.prime='ok';})
      .catch(e=>{a.muted=false;window.AUDIO_DIAG.prime='rejected:'+(e&&e.name||e);});
    else{a.pause();a.muted=false;window.AUDIO_DIAG.prime='sync';}
  }catch(e){}
  try{
    // 3) warm up speech synthesis too (same restriction applies)
    if('speechSynthesis'in window){
      const u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);
    }
  }catch(e){}
}
function stopClips(){
  CLIP_QUEUE.length=0;CLIP_BUSY=false;
  if(CLIP_AUDIO){try{CLIP_AUDIO.onended=null;CLIP_AUDIO.pause();}catch(e){}CLIP_AUDIO=null;}
}
function playClips(keys){
  // play a sequence of clips back-to-back (e.g. حكم + هاص)
  if(!SOUND_ON)return false;
  if(!AUDIO_UNLOCKED){try{window.AUDIO_DIAG.lastErr='not-unlocked';}catch(e){}return false;}
  const list=keys.filter(k=>CLIPS[k]);
  if(!list.length)return false;
  stopClips();
  CLIP_QUEUE=list.slice();
  const step=()=>{
    if(!SOUND_ON||!CLIP_QUEUE.length){CLIP_BUSY=false;CLIP_AUDIO=null;return;}
    const k=CLIP_QUEUE.shift();
    const u=clipUrl(k);
    if(!u){step();return;}
    const a=audioEl();
    CLIP_AUDIO=a;CLIP_BUSY=true;
    a.onended=step;
    a.onerror=step;
    try{a.pause();}catch(e){}
    a.src=u;a.currentTime=0;a.muted=false;a.volume=1;
    const p=a.play();
    if(p&&p.then)p.then(()=>{window.AUDIO_DIAG.lastPlay='playing:'+k;})
      .catch(e=>{window.AUDIO_DIAG.lastErr=(e&&e.name||String(e))+' @'+k;setTimeout(step,10);});
  };
  step();
  return true;
}

function sayKeyword(text){
  if(!text||!SOUND_ON)return;
  // hokm announcement: «حكم» (+ «ثاني») + suit name, as a clip sequence
  if(text.indexOf('حكم')>-1){
    const seq=['hokm'];
    if(text.indexOf('ثاني')>-1)seq.push('thani');
    const suitKey={'سبيت':'spades','هاص':'hearts','ديمن':'diamonds','شيريا':'clubs'};
    for(const ar in suitKey){if(text.indexOf(ar)>-1){seq.push(suitKey[ar]);break;}}
    if(playClips(seq))return;
    let phrase=SAY_PRON['حكم'];
    if(text.indexOf('ثاني')>-1)phrase+=' '+SAY_PRON['ثاني'];
    for(const ar in SUIT_PRON){if(text.indexOf(ar)>-1){phrase+=' '+SUIT_PRON[ar];break;}}
    return speak(phrase,SAY_STYLE[SAY_PRON['حكم']]);
  }
  let k=null;for(const w of SAY_KEYS){if(text.indexOf(w)>-1){k=w;break;}}
  if(!k)return;
  const CLIP_OF={'صن':'sun','أشكل':'sun','سرا':'sira','خمسين':'khamsin','مية':'miyyah',
    'أربعمية':'arbamiyyah','بس':'bas','ولا':'wala','ورق':'waraq','ثاني':'thani','بلوت':'baloot'};
  if(CLIP_OF[k]&&playClips([CLIP_OF[k]]))return;
  const w=SAY_PRON[k]||k;
  speak(w,SAY_STYLE[w]);
}
function voicePreview(){
  if(!SOUND_ON){toast('الصوت مغلق','فعّله أولاً');return;}
  const v=pickVoice();
  toast('تجربة الأصوات 🎙','تسجيلات حقيقية');
  const seq=['صن','حكم','سرا','خمسين','مية','أربعمية','ولا','بلوت'];
  let i=0;
  const next=()=>{
    if(i>=seq.length)return;
    const k=seq[i++];
    if(k==='حكم')sayKeyword('حكم هاص');else sayKeyword(k);
    setTimeout(next,1100);
  };

}
function speak(w,style){
  try{
    if(!('speechSynthesis'in window)||!SOUND_ON)return;
    const synth=window.speechSynthesis;
    try{synth.cancel();}catch(e){}          // never let announcements queue up and lag
    const u=new SpeechSynthesisUtterance(w);
    const v=pickVoice();
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='ar-SA';
    const st=style||{};
    u.rate=st.rate!=null?st.rate:0.95;
    u.pitch=st.pitch!=null?st.pitch:1.0;
    u.volume=st.vol!=null?st.vol:1.0;
    // iOS Safari sometimes needs a beat after cancel() before speaking
    setTimeout(()=>{try{synth.speak(u);}catch(e){}},30);
  }catch(e){}
}
let G=null;

/* ---------- pip geometry (coords are % within the inset .pips box) ---------- */

/* ---------- deal ---------- */
function buildDeck(){

function startHand(){

  for(const seat of order)for(let k=0;k<2;k++)hands[seat].push(deck[idx++]);
  const buyer=deck[idx++];

     phase:'bid',bidRound:1,passes:0,turn:start,mode:null,trump:null,declarer:null,
     curBid:null,bidActed:{S:false,W:false,N:false,E:false},
     trick:[],tricksWon:{0:[],1:[]},lastTrickWinner:null,trickNo:1,

/* ---------- helpers ---------- */
function setActive(seat){for(const s of SEATS)el('seat-'+s).classList.remove('active');el('seat-'+P(seat)).classList.add('active');}
function renderBuyer(show){const b=el('buyer');b.innerHTML='';if(show&&G.buyer){b.appendChild(cardEl(G.buyer,true));b.style.display='block';}else b.style.display='none';}

/* ---------- bidding ---------- */
function bidStep(){
  if(G.phase!=='bid')return;setActive(G.turn);renderBadges();
  if(G.turn===VIEW){showBidUI();return;}
  setTimeout(()=>applyBid(G.turn,aiBid(G.turn)),650);
}
function handStrength(seat,t){let p=0,tr=0;for(const c of G.hands[seat]){if(t&&c.s===t){p+=HK_TRUMP[c.r];tr++;}else p+=SUN_VAL[c.r];}return{p,tr};}
function sunStrength(seat){let p=0,a=0;for(const c of G.hands[seat]){p+=SUN_VAL[c.r];if(c.r==='A')a++;}return{p,a};}
function aiBid(seat){
  const sn=sunStrength(seat);
  const cur=G.curBid, curRank=bidRank(cur);
  if(cur&&cur.seat===seat)return{type:'pass'};
  // candidate hokm suit: round1 only the buyer-card suit; round2 any suit (best by heuristic)
  let bestSuit=null,bp=-1,btr=0;
  const suitPool=(G.bidRound===1)?[G.buyer.s]:SUITS;
  for(const su of suitPool){const hk=handStrength(seat,su);if(hk.tr>=2&&(hk.tr>btr||(hk.tr===btr&&hk.p>bp))){bestSuit=su;bp=hk.p;btr=hk.tr;}}
  // loose prefilter (avoid simulating hopeless hands)
  const maybeSun=(sn.a>=1&&sn.p>=18)||(sn.p>=24);
  const maybeHokm=bestSuit&&(btr>=2);
  // passing is NOT free: an opponent will often buy a winning contract.
  // Base threshold 0; drop it as خربت approaches (round 2, everyone passed so far).
  let BUY_EV=0.0;
  if(G.bidRound===2&&!cur){BUY_EV=-0.15;if(G.passes>=3)BUY_EV=-0.4;}
  let best=null,bestEV=-1e9;
  try{
    if(maybeSun&&curRank<2){
      const ev=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,false,12);
      if(ev>bestEV){bestEV=ev;best={type:'sun'};}
      if(cur&&cur.type==='hokm'&&canAshkal(seat)){
        const ev2=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,true,12);
        if(ev2>bestEV){bestEV=ev2;best={type:'sun',ashkal:true};}
      }
    }
    if(maybeHokm&&curRank<1){
      const ev=simBidEV(G.hands[seat],G.buyer,'hokm',bestSuit,seat,G.firstBidder,false,12);
      if(ev>bestEV){bestEV=ev;best={type:'hokm',suit:bestSuit};}
      // round 2: also try the runner-up suit
      if(G.bidRound===2){
        let s2=null,p2=-1,t2=0;
        for(const su of SUITS){if(su===bestSuit)continue;const hk=handStrength(seat,su);
          if(hk.tr>=2&&(hk.tr>t2||(hk.tr===t2&&hk.p>p2))){s2=su;p2=hk.p;t2=hk.tr;}}
        if(s2){const ev2=simBidEV(G.hands[seat],G.buyer,'hokm',s2,seat,G.firstBidder,false,10);
          if(ev2>bestEV){bestEV=ev2;best={type:'hokm',suit:s2};}}
      }
    }
  }catch(e){best=null;}
  if(best&&bestEV>=BUY_EV)return best;
  // heuristic fallback for strong hands if EV sim unavailable
  if(!best){
    const wantSun=(sn.a>=3)||(sn.a>=2&&sn.p>=30);
    const wantHokm=bestSuit&&(btr>=4||(btr>=3&&bp>=24));
    if(wantSun&&curRank<2){
      if(cur&&cur.type==='hokm'&&canAshkal(seat))return{type:'sun',ashkal:true};
      return{type:'sun'};
    }
    if(wantHokm&&curRank<1)return{type:'hokm',suit:bestSuit};
  }
  return{type:'pass'};
}
function bidRank(b){return !b?0:(b.type==='sun'?2:1);}   // sun outranks hokm
// أشكل right: only the dealer and the player to the dealer's left (the two who didn't get first buy-rights)
// أشكل right: the dealer and the seat to the dealer's LEFT in seating (= the one BEFORE the dealer
// in anticlockwise bidding order). These are the last two to bid, who didn't get first buy-rights.
function leftOfDealer(){return SEATS[(SEATS.indexOf(G.dealer)+3)%4];} // previous seat in bidding order
function canAshkal(seat){return seat===G.dealer||seat===leftOfDealer();}
function applyBid(seat,bid){
  if(bid.type==='pass'){
    const hasBid=!!G.curBid;
    const pw=hasBid?'بس':(seat===G.dealer?(G.bidRound===1?'ثاني':'ورق'):(G.bidRound===1?'بس':'ولا'));
    bubble(seat,pw);
    G.bidActed[seat]=true;
    if(G.curBid){
      const others=SEATS.filter(s=>s!==G.curBid.seat);
      if(others.every(s=>G.bidActed[s])){return lockContract();}
    } else {
      G.passes=(G.passes||0)+1;
      if(G.passes>=4){
        if(G.bidRound===1){ // everyone passed round 1 -> open round 2
          G.bidRound=2;G.passes=0;for(const s of SEATS)G.bidActed[s]=false;
          G.turn=G.firstBidder;toast('الجولة الثانية','Round 2');setTimeout(bidStep,900);return;
        }
        return redeal(); // all passed round 2 -> خربت
      }
    }
    G.turn=nextSeat(G.turn);setTimeout(bidStep,300);
    return;
  }
  // a positive bid (sun / hokm / ashkal). Must outrank the standing contract.
  if(bidRank(bid)<=bidRank(G.curBid)){ // illegal raise -> treat as pass (safety)
    return applyBid(seat,{type:'pass'});
  }
  const isAshkal=(bid.type==='sun'&&bid.ashkal&&canAshkal(seat));
  // round-2 hokm: the SUIT stays hidden until the contract is finally confirmed
  const hideSuit=(bid.type==='hokm'&&G.bidRound===2);
  if(hideSuit&&bid.suit){(G.hokmSuitHint=G.hokmSuitHint||{})[seat]=bid.suit;}
  G.curBid={type:bid.type,suit:bid.type==='hokm'?(hideSuit?null:bid.suit):null,seat,ashkal:isAshkal};
  for(const s of SEATS)G.bidActed[s]=false;G.bidActed[seat]=true;
  let label;
  if(bid.type==='sun')label=isAshkal?'أشكل':'صن';
  else if(hideSuit)label='حكم ثاني';
  else label=(G.bidRound===2?'حكم ثاني ':'حكم ')+SUIT_AR[bid.suit];
  bubble(seat,label,1300);
  G.turn=nextSeat(seat);setTimeout(bidStep,500);
}
function lockContract(){
  const b=G.curBid;
  if(b.type==='hokm'&&!b.suit){
    // round-2 hokm won the bidding but the suit was never revealed — resolve it now
    G.turn=b.seat;
    if(b.seat===VIEW){toast('اختر لون الحكم','');showFinalSuitPicker();}
    else{const r=aiResolveFinal(b.seat);setTimeout(()=>{if(r.sun)finalizeAsSun();else finalizeHokmSuit(r.suit);},700);}
    return;
  }
  G.mode=b.type;G.trump=b.type==='hokm'?b.suit:null;G.declarer=b.seat;
  finishDeal();
}
function finalizeHokmSuit(suit){
  G.curBid.suit=suit;
  bubble(G.curBid.seat,'حكم ثاني '+SUIT_AR[suit],1300);
  G.mode='hokm';G.trump=suit;G.declarer=G.curBid.seat;
  finishDeal();
}
function showFinalSuitPicker(){
  clearActions();
  const exclude=G.buyer.s; // round2: hide the floor-card suit
  actBtn('صن','gold',()=>{clearActions();finalizeAsSun();});
  for(const su of SUITS){if(su===exclude)continue;actBtn(suitLabel(su),'',()=>{clearActions();finalizeHokmSuit(su);});}
}
function finalizeAsSun(){
  G.curBid.type='sun';G.curBid.suit=null;
  bubble(G.curBid.seat,'صن',1300);
  G.mode='sun';G.trump=null;G.declarer=G.curBid.seat;
  finishDeal();
}
function aiPickFinalSuit(seat){
  const hint=G.hokmSuitHint&&G.hokmSuitHint[seat];
  if(hint)return hint;
  let bestSuit=G.buyer.s,bp=-1,btr=-1;
  for(const su of SUITS){if(su===G.buyer.s)continue;const hk=handStrength(seat,su);
    if(hk.tr>btr||(hk.tr===btr&&hk.p>bp)){bestSuit=su;bp=hk.p;btr=hk.tr;}}
  return bestSuit;
}
function aiResolveFinal(seat){
  // reconsider صن vs the hinted hokm suit now that bidding is fully settled
  const su=aiPickFinalSuit(seat);
  try{
    const evH=simBidEV(G.hands[seat],G.buyer,'hokm',su,seat,G.firstBidder,false,10);
    const sn=sunStrength(seat);
    if(sn.a>=1&&sn.p>=18){
      const evS=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,false,10);
      if(evS>evH)return{sun:true};
    }
  }catch(e){}

}
function redeal(){MATCH.dealer=nextSeat(MATCH.dealer);setTimeout(startHand,1100);}
function finishDeal(){
  // who receives the face-up (الأرض): the declarer, OR his partner if the contract is أشكل
  const taker=(G.curBid&&G.curBid.ashkal)?partnerOf(G.declarer):G.declarer;
  G.hands[taker].push(G.buyer);
  const fill={[taker]:2};for(const s of SEATS)if(!(s in fill))fill[s]=3;
  let r=0;for(const seat of G.order)for(let k=0;k<fill[seat];k++)G.hands[seat].push(G.rest[r++]);
  for(const s of SEATS)sortHand(s);
  renderBuyer(false);G.phase='play';G.turn=G.firstBidder;G.trickNo=1;
  G.void={S:{},W:{},N:{},E:{}};G.signal={};G.history=[];
  detectProjects();G.justDealt=true;renderAll();renderBadges();updateModePill();
  setTimeout(playStep,500);
}
function cardOrder(c){return (G.mode==='hokm'&&c.s===G.trump)?ORD_TRUMP.indexOf(c.r):ORD_PLAIN.indexOf(c.r);}
function sortHand(seat){G.hands[seat].sort((a,b)=>a.s!==b.s?SUITS.indexOf(a.s)-SUITS.indexOf(b.s):cardOrder(a)-cardOrder(b));}

/* ---------- projects ---------- */
function detectProjects(){
  G.ownerProjects={};G.seatProjects={};G.declared={};G.declaredDone={};
  for(const seat of SEATS) G.seatProjects[seat]=findProjects(G.hands[seat]);
}
function findProjects(hand){
  const res=[],bySuit={};
  for(const c of hand)(bySuit[c.s]=bySuit[c.s]||[]).push(c);
  for(const s in bySuit){
    const cards=bySuit[s].slice().sort((a,b)=>ORD_SEQ.indexOf(a.r)-ORD_SEQ.indexOf(b.r));
    let start=0;
    for(let i=1;i<=cards.length;i++){
      const cons=i<cards.length&&ORD_SEQ.indexOf(cards[i].r)===ORD_SEQ.indexOf(cards[i-1].r)+1;
      if(!cons){
        const run=i-start, seq=cards.slice(start,i), top=ORD_SEQ.indexOf(cards[i-1].r);
        if(run>=5)res.push({name:'مية',pts:100,top,cards:seq});
        else if(run===4)res.push({name:'خمسين',pts:50,top,cards:seq});
        else if(run===3)res.push({name:'سرا',pts:20,top,cards:seq});
        start=i;
      }
    }
  }
  const byRank={};for(const c of hand)(byRank[c.r]=byRank[c.r]||[]).push(c);
  for(const r in byRank)if(byRank[r].length===4){
    if(r==='A'&&G.mode==='sun')res.push({name:'أربعمية',pts:400,top:99,cards:byRank[r]});
    else if(['10','J','Q','K','A'].includes(r))res.push({name:'مية',pts:100,top:90+ORD_SEQ.indexOf(r),cards:byRank[r]});
  }
  return res;
}
function declarePhase(seat){
  const found=G.seatProjects[seat]||[];
  if(seat!==VIEW){
    // AI announces every project it holds
    G.declared[seat]=found.slice();G.declaredDone[seat]=true;
    setTimeout(playStep,120);
    return;
  }
  G.projPick={'سرا':0,'خمسين':0,'مية':0,'أربعمية':0};
  showProjectChoice();highlightPlayable();
}
const PROJ_MAX={'سرا':2,'خمسين':2,'مية':2,'أربعمية':1};
function showProjectChoice(){
  clearActions();
  const types = G.mode==='sun' ? ['سرا','خمسين','مية','أربعمية'] : ['سرا','خمسين','مية'];
  const pick=G.projPick||(G.projPick={'سرا':0,'خمسين':0,'مية':0,'أربعمية':0});
  for(const name of types){
    const n=pick[name]||0;
    const label=n?(name+' ×'+n):name;
    actBtn(label,n?'gold':'',()=>{
      // every button cycles freely; a project that isn't really held simply never scores
      const mx=PROJ_MAX[name]||1;
      pick[name]=((pick[name]||0)+1)>mx?0:(pick[name]||0)+1;
      showProjectChoice();               // keep the panel visible with updated counters
    });
  }
  actBtn('✔ تم','ghost',()=>confirmProjects());
  toast('مشروعك','اضغط لزيادة العدد · ثم «تم»');
}
function confirmProjects(){
  clearActions();
  const pick=G.projPick||{};
  const mine=(G.seatProjects[VIEW]||[]).slice();
  const out=[];
  for(const name in pick){
    const n=pick[name]||0;if(!n)continue;
    const cands=mine.filter(p=>p.name===name).sort((a,b)=>b.top-a.top);
    // a claim is announced freely, but only a real project ever scores — silently
    const take=Math.min(n,cands.length);
    for(let i=0;i<take;i++)out.push(cands[i]);
  }
  G.declared[VIEW]=out;G.declaredDone[VIEW]=true;
  playStep();
}
function declaredList(seat){const d=G.declared[seat];if(!d)return[];return Array.isArray(d)?d:[d];}
function computeProjectWinner(){
  const best={0:null,1:null};
  for(const seat of SEATS){const t=TEAM[seat];
    for(const it of declaredList(seat)){
      if(!best[t]||it.pts>best[t].it.pts||(it.pts===best[t].it.pts&&it.top>best[t].it.top))best[t]={it,seat};}}
  let w=null;
  if(best[0]&&best[1]) w=(best[0].it.pts>best[1].it.pts||(best[0].it.pts===best[1].it.pts&&best[0].it.top>=best[1].it.top))?0:1;
  else if(best[0])w=0;else if(best[1])w=1;
  G.ownerProjects={};G.projectPoints=0;G.projectWinner=w;
  if(w!==null){
    let tot=0,names=[];
    for(const seat of SEATS){if(TEAM[seat]!==w)continue;
      const list=declaredList(seat);if(!list.length)continue;
      let cards=[];
      for(const it of list){tot+=it.pts;names.push(it.name);if(it.cards)cards=cards.concat(it.cards);}
      const lbl=list.length>1?(list.length+' مشاريع'):list[0].name;
      G.ownerProjects[seat]={name:lbl,cards};}
    G.projectPoints=tot;
    setTimeout(()=>toast('مشاريع '+(w===0?'لنا':'لهم'),names.join(' + ')+' · '+tot),300);
  }
}
function projectsVisible(){return G.phase==='play'&&G.trickNo===2;}

/* ---------- play ---------- */
function trumpSuit(){return G.mode==='hokm'?G.trump:null;}
function rankStrength(c,lead){const t=trumpSuit();if(t&&c.s===t)return 200+ORD_TRUMP.indexOf(c.r);if(c.s===lead)return 100+ORD_PLAIN.indexOf(c.r);return ORD_PLAIN.indexOf(c.r);}
function legalCards(seat){
  const h=G.hands[seat];
  if(!G.trick.length)return h.slice();
  const lead=G.trick[0].card.s;
  const fol=h.filter(c=>c.s===lead);
  if(fol.length)return fol; // must follow suit
  const ts=trumpSuit();
  if(!ts)return h.slice(); // sun: any card
  // hokm: out of led suit
  // find current trick winner
  let ws=null,wstr=-1;
  for(const p of G.trick){const x=rankStrength(p.card,lead);if(x>wstr){wstr=x;ws=p.seat;}}
  const partnerWin=ws&&TEAM[ws]===TEAM[seat];
  const myTrumps=h.filter(c=>c.s===ts);
  if(partnerWin)return h.slice(); // partner winning -> may discard freely
  if(!myTrumps.length)return h.slice(); // no trump -> may discard
  // must trump; over-trump if possible
  const trumpsOnTable=G.trick.filter(p=>p.card.s===ts);
  if(trumpsOnTable.length){
    const topT=trumpsOnTable.reduce((a,b)=>ORD_TRUMP.indexOf(b.card.r)>ORD_TRUMP.indexOf(a.card.r)?b:a).card;
    const over=myTrumps.filter(c=>ORD_TRUMP.indexOf(c.r)>ORD_TRUMP.indexOf(topT.r));
    return over.length?over:h.slice(); // can't over-trump → free (no forced under-trump)
  }
  return myTrumps; // no trump on the table yet -> must play one
}
function playStep(){
  if(G.phase!=='play')return;
  setActive(G.turn);renderBadges();
  if(G.trickNo===1 && !G.declaredDone[G.turn]) return declarePhase(G.turn);
  if(G.turn===VIEW){highlightPlayable();return;}
  if(DBG.paused)return; // coach mode: wait for manual play or متابعة
  setTimeout(()=>{if(!DBG.paused)playCard(G.turn,aiPlay(G.turn));},700);
}
function playedCards(){const a=[];for(const t of[0,1])a.push(...G.tricksWon[t]);for(const p of G.trick)a.push(p.card);return a;}
function partnerOf(seat){for(const s of SEATS)if(s!==seat&&TEAM[s]===TEAM[seat])return s;return null;}
// is `card` the highest still-outstanding card of `suit` (nobody else can beat it if led)
function isMaster(card,suit,played,seat){
  const ord=(G.mode==='hokm'&&suit===trumpSuit())?ORD_TRUMP:ORD_PLAIN;
  const mine=new Set(G.hands[seat].filter(c=>c.s===suit).map(c=>c.r));
  const seen=new Set(played.filter(c=>c.s===suit).map(c=>c.r));
  for(const r of RANKS){
    if(r===card.r||mine.has(r)||seen.has(r))continue;
    if(ord.indexOf(r)>ord.indexOf(card.r))return false;
  }
  return true;
}
// FAIR-PLAY: suit of partner's REVEALED project only (public info after the reveal in trick 2)
function partnerProjectSuit(seat,minPts){
  const p=partnerOf(seat);if(!p)return null;
  if(!(G.projShown&&G.projShown[p]))return null;
  const it=G.ownerProjects&&G.ownerProjects[p];
  if(!it||!it.cards||it.cards.length<3)return null;
  const su=it.cards[0].s;if(!it.cards.every(c=>c.s===su))return null;
  if((it.pts||0)<minPts)return null;
  return su;
}
function oppSeats(seat){return SEATS.filter(s=>TEAM[s]!==TEAM[seat]);}
function isVoid(s,suit){return !!(G.void&&G.void[s]&&G.void[s][suit]);}
// suit partner is asking for, via discard signal (paired suit)
function wantedSuit(seat){const p=partnerOf(seat);if(!p||!G.signal)return null;const d=G.signal[p];return d?SUITPAIR[d]:null;}
function declarerLead(seat,legal,val){
  const ts=trumpSuit(),played=playedCards();
  const myTrumps=legal.filter(c=>c.s===ts).sort((a,b)=>rankStrength(b,ts)-rankStrength(a,ts));
  const trumpsSeen=played.filter(c=>c.s===ts).length;
  const unseenTrumps=8-G.hands[seat].filter(c=>c.s===ts).length-trumpsSeen;
  const oppMayTrump=unseenTrumps>0&&oppSeats(seat).some(o=>!isVoid(o,ts));
  // 1) pull trumps only while an OPPONENT might still hold trump (don't pull partner's)
  if(myTrumps.length&&oppMayTrump){
    if(isMaster(myTrumps[0],ts,played,seat))return myTrumps[0];
    if(myTrumps.length>=4)return myTrumps[myTrumps.length-1];
    if(ORD_TRUMP.indexOf(myTrumps[0].r)>=ORD_TRUMP.indexOf('10'))return myTrumps[myTrumps.length-1];
  }
  // 2) cash winning side cards; prefer the suit partner is asking for
  const sideMasters=legal.filter(c=>c.s!==ts&&isMaster(c,c.s,played,seat));
  if(sideMasters.length){
    const want=wantedSuit(seat);
    const pref=sideMasters.filter(c=>c.s===want);
    const pool=pref.length?pref:sideMasters;
    pool.sort((a,b)=>val(b)-val(a));return pool[0];
  }
  // 3) serve partner's project (50/100): lead low into that suit
  const psuit=partnerProjectSuit(seat,50);
  if(psuit){const sc=legal.filter(c=>c.s===psuit).sort((a,b)=>val(a)-val(b));if(sc.length)return sc[0];}
  // 4) follow partner's request: lead low into the suit he asked for
  const want=wantedSuit(seat);
  if(want){const wc=legal.filter(c=>c.s===want&&c.s!==ts).sort((a,b)=>val(a)-val(b));if(wc.length)return wc[0];}
  // 5) fallback: lowest non-trump, preserve trump
  const nt=legal.filter(c=>c.s!==ts).sort((a,b)=>val(a)-val(b));
  if(nt.length)return nt[0];
  legal.sort((a,b)=>val(a)-val(b));return legal[0];
}
// SUN: establish a sequence by ducking — lead its lowest card so the rest become masters
function sunEstablish(seat,legal,played){
  const runs=findProjects(G.hands[seat]).filter(it=>it.cards.length>=3&&it.cards.every(c=>c.s===it.cards[0].s));
  let best=null;
  for(const run of runs){
    const su=run.cards[0].s;
    const strong=run.cards.reduce((a,b)=>ORD_PLAIN.indexOf(b.r)>ORD_PLAIN.indexOf(a.r)?b:a);
    const mine=new Set(G.hands[seat].filter(c=>c.s===su).map(c=>c.r));
    const seen=new Set(played.filter(c=>c.s===su).map(c=>c.r));
    let higherOut=0;
    for(const r of RANKS){if(r===strong.r||mine.has(r)||seen.has(r))continue;if(ORD_PLAIN.indexOf(r)>ORD_PLAIN.indexOf(strong.r))higherOut++;}
    if(higherOut>0&&higherOut<run.cards.length){
      if(!best||higherOut<best.higherOut||(higherOut===best.higherOut&&run.pts>best.run.pts))best={run,higherOut};
    }
  }
  if(!best)return null;
  const cand=best.run.cards.filter(c=>legal.some(l=>l.s===c.s&&l.r===c.r));
  if(!cand.length)return null;
  cand.sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
  return cand[0];
}
function sunLead(seat,legal,val){
  const played=playedCards();
  // 1) cash winning cards (highest outstanding in their suit), strongest value first
  const masters=legal.filter(c=>isMaster(c,c.s,played,seat)).sort((a,b)=>val(b)-val(a));
  if(masters.length)return masters[0];
  // 2) establish own sequence by ducking the lowest card
  const est=sunEstablish(seat,legal,played);
  if(est)return est;
  // 3) serve partner's declared sequence: lead low into that suit
  const psuit=partnerProjectSuit(seat,20);
  if(psuit){const sc=legal.filter(c=>c.s===psuit).sort((a,b)=>val(a)-val(b));if(sc.length)return sc[0];}
  // 4) follow partner's request signal
  const want=wantedSuit(seat);
  if(want){const wc=legal.filter(c=>c.s===want).sort((a,b)=>val(a)-val(b));if(wc.length)return wc[0];}
  // 5) fallback: lowest card
  legal.sort((a,b)=>val(a)-val(b));return legal[0];
}

/* Fair-information AI core — pure functions, no DOM, no hidden info.
   Uses ONLY: own hand, played cards, current trick, contract, derived voids/signals,
   publicly revealed projects, and public hand counts. */
const AI_LEVEL={n:5,label:'محترف'};
window.AILOG=window.AILOG||[];
function aiLog(e){try{window.AILOG.push(e);if(window.AILOG.length>300)window.AILOG.splice(0,window.AILOG.length-300);}catch(_){ }}
function masterRankIdx(c,trump,mode){const isT=(mode==='hokm'&&c.s===trump);const ord=isT?ORD_TRUMP:ORD_PLAIN;return ord.indexOf(c.r);}
function sortMastersStrongFirst(arr,mode,trump,val){
  return arr.sort((a,b)=>{const da=masterRankIdx(a,trump,mode),db=masterRankIdx(b,trump,mode);if(db!==da)return db-da;return val(b)-val(a);});
}
function simKey(c){return c.s+c.r;}
function simVal(mode,trump,c){return(mode==='hokm'&&c.s===trump)?HK_TRUMP[c.r]:SUN_VAL[c.r];}
function simStr(mode,trump,lead,c){if(mode==='hokm'&&c.s===trump)return 200+ORD_TRUMP.indexOf(c.r);if(c.s===lead)return 100+ORD_PLAIN.indexOf(c.r);return ORD_PLAIN.indexOf(c.r);}
function simLegal(hand,trick,mode,trump,seat){
  if(!trick.length)return hand.slice();
  const lead=trick[0].card.s;
  const f=hand.filter(c=>c.s===lead);if(f.length)return f;
  if(mode!=='hokm'||!trump)return hand.slice();
  let ws=null,wstr=-1;for(const p of trick){const x=simStr(mode,trump,lead,p.card);if(x>wstr){wstr=x;ws=p.seat;}}
  const partnerWin=seat&&ws&&TEAM[ws]===TEAM[seat];
  const myT=hand.filter(c=>c.s===trump);
  if(partnerWin||!myT.length)return hand.slice();
  const tt=trick.filter(p=>p.card.s===trump);
  if(tt.length){const top=tt.reduce((a,b)=>ORD_TRUMP.indexOf(b.card.r)>ORD_TRUMP.indexOf(a.card.r)?b:a).card;
    const over=myT.filter(c=>ORD_TRUMP.indexOf(c.r)>ORD_TRUMP.indexOf(top.r));
    return over.length?over:hand.slice(); // can't over-trump → free (no forced under-trump)
  }
  return myT;
}
function simClone(st){return{mode:st.mode,trump:st.trump,declarer:st.declarer,turn:st.turn,trickNo:st.trickNo,
  hands:{S:st.hands.S.slice(),W:st.hands.W.slice(),N:st.hands.N.slice(),E:st.hands.E.slice()},
  trick:st.trick.slice(),seenSet:new Set(st.seenSet),
  void:{S:Object.assign({},st.void.S),W:Object.assign({},st.void.W),N:Object.assign({},st.void.N),E:Object.assign({},st.void.E)},
  signal:Object.assign({},st.signal),reveal:Object.assign({},st.reveal),
  pts:{0:st.pts[0],1:st.pts[1]},lastWin:st.lastWin};}
function simSeenAll(st){const s=new Set(st.seenSet);for(const p of st.trick)s.add(simKey(p.card));return s;}
function simIsMaster(st,seat,card){
  const ord=(st.mode==='hokm'&&card.s===st.trump)?ORD_TRUMP:ORD_PLAIN;
  const mine=new Set(st.hands[seat].filter(c=>c.s===card.s).map(c=>c.r));
  const seen=simSeenAll(st);
  for(const r of RANKS){if(r===card.r||mine.has(r)||seen.has(card.s+r))continue;
    if(ord.indexOf(r)>ord.indexOf(card.r))return false;}
  return true;}
function simWantedSuit(st,seat){const p=partnerOf(seat);const d=p&&st.signal[p];return d?SUITPAIR[d]:null;}
function simRevealSuit(st,seat,minPts){const p=partnerOf(seat);if(!p)return null;const r=st.reveal[p];return (r&&r.pts>=minPts)?r.suit:null;}
function simRuffRiskLead(st,seat,su){
  if(st.mode!=='hokm'||su===st.trump)return false;
  let mineT=st.hands[seat].filter(c=>c.s===st.trump).length,seenT=0;
  const seen=simSeenAll(st);seen.forEach(k=>{if(k.slice(0,st.trump.length)===st.trump)seenT++;});

function simDeclLeadHokm(st,seat,legal){
  const ts=st.trump,val=c=>simVal(st.mode,ts,c);
  const myT=legal.filter(c=>c.s===ts).sort((a,b)=>simStr(st.mode,ts,ts,b)-simStr(st.mode,ts,ts,a));
  const seen=simSeenAll(st);let seenT=0;seen.forEach(k=>{if(k.slice(0,ts.length)===ts)seenT++;});
  const unseenT=8-st.hands[seat].filter(c=>c.s===ts).length-seenT;
  const oppMayT=unseenT>0&&oppSeats(seat).some(o=>!st.void[o][ts]);
  const isDeclarer=(seat===st.declarer);
  // التربيع = لعب الحكم. القاعدة موحّدة للمشتري وشريكه:
  //  • معك البوس (الولد/الأعلى) → تربّع به
  //  • ما معك البوس → تربّع بأصغر حكم لإطاحة الولد، واحتفظ بالأعلى ليأكل لاحقًا
  if(myT.length&&oppMayT){
    if(simIsMaster(st,seat,myT[0]))return{c:myT[0],why:'تربيع بالبوس'};
    if(myT.length>=4)return{c:myT[myT.length-1],why:'مواصلة التربيع بأصغر حكم'};
    if(ORD_TRUMP.indexOf(myT[0].r)>=ORD_TRUMP.indexOf('10'))return{c:myT[myT.length-1],why:'تربيع بأصغر حكم لإطاحة الولد'};
  }
  const masters=legal.filter(c=>c.s!==ts&&simIsMaster(st,seat,c)&&!simRuffRiskLead(st,seat,c.s));
  if(masters.length){const want=simWantedSuit(st,seat);const pref=masters.filter(c=>c.s===want);const pool=pref.length?pref:masters;sortMastersStrongFirst(pool,st.mode,st.trump,val);return{c:pool[0],why:'صرف ورقة آكلة (الأكبر أولاً)'};}
  const ps=simRevealSuit(st,seat,50);
  if(ps){const sc=legal.filter(c=>c.s===ps).sort((a,b)=>val(a)-val(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));if(sc.length)return{c:sc[0],why:'خدمة مشروع الشريك'};}
  const want=simWantedSuit(st,seat);
  if(want){const wc=legal.filter(c=>c.s===want&&c.s!==ts).sort((a,b)=>val(a)-val(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));if(wc.length)return{c:wc[0],why:'تلبية إشارة الشريك'};}
  // مثلوث: hold 3+ of a non-trump suit with a decent top → lead its LOWEST to establish the top
  {
    const by={};for(const c of legal){if(c.s===ts)continue;(by[c.s]=by[c.s]||[]).push(c);}
    let bestSuit=null,bestTop=-1;
    for(const s in by){
      if(by[s].length<3)continue;
      const topC=by[s].reduce((a,b)=>ORD_PLAIN.indexOf(b.r)>ORD_PLAIN.indexOf(a.r)?b:a);
      const top=ORD_PLAIN.indexOf(topC.r);
      if(top<ORD_PLAIN.indexOf('K'))continue;
      if(simIsMaster(st,seat,topC))continue; // already free → cash instead
      if(top>bestTop&&!simRuffRiskLead(st,seat,s)){bestTop=top;bestSuit=s;}
    }
    if(bestSuit){
      const cs=by[bestSuit].sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
      return{c:cs[0],why:'مثلوث: تحرير الورقة الكبيرة'};
    }
  }
  // رأس التتابع: معي K+Q من لون جانبي → أدق بالـK لأجبر الإكة وأحرر الـQ
  {
    const by={};for(const c of legal){if(c.s===ts)continue;(by[c.s]=by[c.s]||[]).push(c);}
    for(const s in by){
      const hasK=by[s].some(c=>c.r==='K'),hasQ=by[s].some(c=>c.r==='Q');
      if(hasK&&hasQ&&!simIsMaster(st,seat,{s,r:'K'})&&!simRuffRiskLead(st,seat,s))

    }
  }
  const nt=legal.filter(c=>c.s!==ts).sort((a,b)=>val(a)-val(b));
  if(nt.length)return{c:nt[0],why:'حفظ الحكم'};
  legal.sort((a,b)=>val(a)-val(b));return{c:legal[0],why:'أصغر حكم'};}
function simRuns(hand){const res=[],by={};for(const c of hand)(by[c.s]=by[c.s]||[]).push(c);
  for(const s in by){const cs=by[s].slice().sort((a,b)=>ORD_SEQ.indexOf(a.r)-ORD_SEQ.indexOf(b.r));let s0=0;
    for(let i=1;i<=cs.length;i++){const cons=i<cs.length&&ORD_SEQ.indexOf(cs[i].r)===ORD_SEQ.indexOf(cs[i-1].r)+1;
      if(!cons){const run=i-s0;if(run>=3)res.push({pts:run>=5?100:(run===4?50:20),cards:cs.slice(s0,i)});s0=i;}}}

function simPolicy(st,seat){
  const hand=st.hands[seat],legal=simLegal(hand,st.trick,st.mode,st.trump,seat);
  if(legal.length===1)return{c:legal[0],why:'إجباري'};
  const lead=st.trick.length?st.trick[0].card.s:null;
  const val=c=>simVal(st.mode,st.trump,c);

    const dteam=st.declarer!=null?TEAM[st.declarer]:null;

      if(ORD_PLAIN.indexOf(topC.r)<ORD_PLAIN.indexOf('K'))continue;   // freeing a 9 is pointless
      if(simIsMaster(st,seat,topC))continue;                          // already free → cash instead
      // how many cards outrank my top and are still out?
      const su=run.cards[0].s;const mine=new Set(st.hands[seat].filter(c=>c.s===su).map(c=>c.r));

function renderHand(){

  const w0=Math.round(66*sc), h0=Math.round(100*sc), fs=(19*sc).toFixed(1), mg=Math.round(w0*ov), arc=tilt*0.2667;

function renderArrange(){
  const w=el('hand');w.innerHTML='';w.style.position='relative';w.style.minHeight='80px';
  const n=G.hands[VIEW].length, cardW=44, cardH=64, slotW=46;
  const cw=w.clientWidth||340, offsetX=Math.max(4,(cw-slotW*n)/2);
  const nodes=[];
  G.hands[VIEW].forEach((c,i)=>{
    const d=cardEl(c,true);d.classList.add('arrcard');
    d.style.position='absolute';d.style.width=cardW+'px';d.style.height=cardH+'px';
    d.style.top='8px';d.style.left=(offsetX+i*slotW)+'px';d.dataset.idx=i;
    nodes.push(d);w.appendChild(d);attachDrag(d);
  });
  G._arr={slotW,offsetX,nodes};
}
function attachDrag(d){
  let dragging=false,startX=0,baseLeft=0,idx=0;
  const X=e=>e.touches?e.touches[0].clientX:e.clientX;
  const move=e=>{
    if(!dragging)return; e.preventDefault();
    const dx=X(e)-startX, A=G._arr;
    d.style.left=(baseLeft+dx)+'px';
    let t=Math.round((baseLeft+dx-A.offsetX)/A.slotW);
    t=Math.max(0,Math.min(A.nodes.length-1,t));
    if(t!==idx){
      const cards=G.hands[VIEW];const[m]=cards.splice(idx,1);cards.splice(t,0,m);
      const[nm]=A.nodes.splice(idx,1);A.nodes.splice(t,0,nm);
      idx=t;
      A.nodes.forEach((node,j)=>{node.dataset.idx=j;if(node!==d){node.style.transition='left .15s';node.style.left=(A.offsetX+j*A.slotW)+'px';}});
    }
  };
  const up=()=>{
    if(!dragging)return; dragging=false; const A=G._arr;
    d.style.transition='left .15s';d.style.left=(A.offsetX+idx*A.slotW)+'px';
    d.style.zIndex='';d.classList.remove('dragging');
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
  };
  const down=e=>{
    if(!G.arrange)return; e.preventDefault();
    dragging=true; idx=+d.dataset.idx; startX=X(e); baseLeft=parseFloat(d.style.left);
    d.style.transition='none';d.style.zIndex=999;d.classList.add('dragging');
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  };
  d.addEventListener('touchstart',down,{passive:false});
  d.addEventListener('mousedown',down);
}

const MOVABLE=['scorebox','rug','center','play-N','play-E','play-W','play-S','seat-N','seat-E','seat-W','seat-S','fan-N','fan-E','fan-W','proj-N','proj-E','proj-W','proj-S','hand-wrap','actionbar'];
const LKEY='baloot_layout_v2';
const DEFAULT_LAYOUT={"rug":{"dx":-2,"dy":96},"fan-N":{"dx":190,"dy":-26},"fan-E":{"dx":-7,"dy":-55},"fan-W":{"dx":381,"dy":-110},"proj-N":{"dx":-34,"dy":-26},"proj-E":{"dx":-26,"dy":53},"proj-W":{"dx":24,"dy":58},"proj-S":{"dx":148,"dy":37},"center":{"dx":-26,"dy":83},"play-N":{"dx":-7,"dy":3},"play-E":{"dx":51,"dy":-44},"play-W":{"dx":-9,"dy":-46},"play-S":{"dx":-5,"dy":-23},"seat-N":{"dx":1,"dy":28},"seat-E":{"dx":-17,"dy":-92},"seat-W":{"dx":8,"dy":-80},"seat-S":{"dx":-161,"dy":21},"hand-wrap":{"dx":-1,"dy":-40},"actionbar":{"dx":-3,"dy":-25}};
let LAYOUT={};
const PKEY='baloot_proj_v3';
const DEFAULT_PROJ={S:{scale:1.9,vertical:false,overlap:0.85,tilt:9,rot:0},N:{scale:1.6,vertical:false,overlap:0.85,tilt:6,rot:-180},E:{scale:1.6,vertical:true,overlap:0.85,tilt:7,rot:90},W:{scale:1.6,vertical:true,overlap:0.85,tilt:9,rot:-90}};
const SEAT_SHORT={S:'أنت',N:'شريك',E:'يسار',W:'يمين'};
let SELPROJ=null;
let PROJCFG=JSON.parse(JSON.stringify(DEFAULT_PROJ));
const HKEY='baloot_hand_v1';
let HANDCFG={scale:1.4,overlap:0.64,tilt:3.5,rot:0};
function loadHand(){try{const o=JSON.parse(localStorage.getItem(HKEY));if(o)HANDCFG=Object.assign({scale:1.4,overlap:0.64,tilt:3.5,rot:0},o);}catch(e){}}
function saveHand(){try{localStorage.setItem(HKEY,JSON.stringify(HANDCFG));}catch(e){}}
function loadProj(){PROJCFG=JSON.parse(JSON.stringify(DEFAULT_PROJ));try{const o=JSON.parse(localStorage.getItem(PKEY));if(o)for(const s of SEATS)if(o[s])PROJCFG[s]=Object.assign({scale:1,vertical:false,overlap:0.5,tilt:9,rot:0},o[s]);}catch(e){}}
function saveProj(){try{localStorage.setItem(PKEY,JSON.stringify(PROJCFG));}catch(e){}}
function selectProj(s){SELPROJ=s;for(const x of SEATS){const b=el('proj-'+x);if(b)b.classList.toggle('selp',x===s);}updateProjBtn();}
function updateProjBtn(){const b=el('proj-sel');if(!b)return;
  b.textContent = SELPROJ ? ('مشروع ('+SEAT_SHORT[SELPROJ]+')') : 'اختر مشروع';}
function loadLayout(){try{const o=JSON.parse(localStorage.getItem(LKEY));return (o&&Object.keys(o).length)?o:JSON.parse(JSON.stringify(DEFAULT_LAYOUT));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_LAYOUT));}}
function saveLayout(){const m={};document.querySelectorAll('.movable').forEach(el=>{if(el._dx||el._dy)m[el.id]={dx:Math.round(el._dx),dy:Math.round(el._dy)};});try{localStorage.setItem(LKEY,JSON.stringify(m));}catch(e){}}
function ensureBase(el){if(el._base===undefined){const t=getComputedStyle(el).transform;el._base=(t&&t!=='none')?t:'';}}
function setT(el){el.style.transform='translate('+(el._dx||0)+'px,'+(el._dy||0)+'px) '+(el._base||'');}
function applyLayout(){document.querySelectorAll('.movable').forEach(el=>{ensureBase(el);const o=LAYOUT[el.id];el._dx=o?o.dx:0;el._dy=o?o.dy:0;if(el._dx||el._dy)setT(el);});}
function makeDraggable(el){
  let on=false,sx=0,sy=0,bx=0,by=0;
  const P=e=>e.touches?e.touches[0]:e;
  const move=e=>{if(!on)return;e.preventDefault();const p=P(e);el._dx=bx+(p.clientX-sx);el._dy=by+(p.clientY-sy);setT(el);};
  const up=()=>{if(!on)return;on=false;el.classList.remove('moving');
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
  const down=e=>{if(!document.body.classList.contains('editing'))return;e.preventDefault();e.stopPropagation();
    if(el.id&&el.id.indexOf('proj-')===0)selectProj(el.id.slice(5));
    ensureBase(el);on=true;const p=P(e);sx=p.clientX;sy=p.clientY;bx=el._dx||0;by=el._dy||0;el.classList.add('moving');
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);};
  el.addEventListener('touchstart',down,{passive:false});el.addEventListener('mousedown',down);
}
function initLayoutEditor(){
  LAYOUT=loadLayout();loadProj();loadHand();updateProjBtn();
  MOVABLE.forEach(id=>{const el=document.getElementById(id);if(el){el.classList.add('movable');makeDraggable(el);}});
  applyLayout();
}
function renderPlayEdit(){
  const editing=document.body.classList.contains('editing');
  if(editing){
    const demo={N:{s:'spades',r:'A'},E:{s:'hearts',r:'K'},W:{s:'diamonds',r:'10'},S:{s:'clubs',r:'Q'}};
    for(const s of SEATS){const slot=el('play-'+s);if(!slot)continue;slot.innerHTML='';slot.appendChild(cardEl(demo[s],true));}
  } else {
    clearPlays();
    if(G&&G.trick)for(const p of G.trick)renderPlay(p.seat,p.card);
  }
}
function exportLayout(){
  const layout={};
  document.querySelectorAll('.movable').forEach(el=>{if(el._dx||el._dy)layout[el.id]={dx:Math.round(el._dx),dy:Math.round(el._dy)};});
  return JSON.stringify({layout,proj:PROJCFG,hand:HANDCFG});
}
function copyLayout(){
  const data=exportLayout();
  const ok=()=>toast('تم نسخ التصميم','الصقه للمطوّر ليثبّته');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(ok).catch(()=>window.prompt('انسخ التصميم:',data));return;} }catch(e){}
  window.prompt('انسخ التصميم:',data);
}
function toggleEdit(){
  const b=document.body;
  if(b.classList.contains('editing')){b.classList.remove('editing');saveLayout();saveProj();toast('تم اعتماد التصميم');}
  else{b.classList.add('editing');SELPROJ=null;updateProjBtn();toast('حرّك العناصر','اختر مكان المشروع لتغيّر حجمه واتجاهه');}
  renderProjects();renderPlayEdit();
}
function resetLayout(){
  LAYOUT={};document.querySelectorAll('.movable').forEach(el=>{el._dx=0;el._dy=0;el.style.transform=el._base||'';});
  try{localStorage.removeItem(LKEY);}catch(e){}toast('رجع التصميم للأصل');
}
window.addEventListener('load',()=>{
  el('arrange-btn').onclick=toggleArrange;
  // unlock audio on the first real user gesture (required by iOS Safari)
  (function(){
    const fire=()=>{unlockAudio();
      document.removeEventListener('touchstart',fire,true);
      document.removeEventListener('pointerdown',fire,true);
      document.removeEventListener('click',fire,true);};
    document.addEventListener('touchstart',fire,true);
    document.addEventListener('pointerdown',fire,true);
    document.addEventListener('click',fire,true);
  })();
  // triple-tap 🔊 → show audio diagnostics
  (function(){const b=el('snd-btn');if(!b)return;let n=0,t=null;
    b.addEventListener('click',()=>{n++;clearTimeout(t);
      t=setTimeout(()=>{if(n>=3){const d=window.AUDIO_DIAG||{};
        toast('تشخيص الصوت','فتح:'+d.unlock+' · سياق:'+d.ctx+' · تهيئة:'+d.prime+' · مقاطع:'+d.clips+' · آخر:'+(d.lastPlay||'-')+' · خطأ:'+(d.lastErr||'-'));}
        n=0;},700);});})();
  el('snd-btn').onclick=()=>{unlockAudio();SOUND_ON=!SOUND_ON;el('snd-btn').firstChild.textContent=SOUND_ON?'🔊':'🔇';if(!SOUND_ON){stopClips();if('speechSynthesis'in window){try{speechSynthesis.cancel();}catch(e){}}}};
  // long-press 🔊 → preview every announcement so the voice can be judged quickly
  (function(){
    const b=el('snd-btn');if(!b)return;let t=null;
    const start=()=>{t=setTimeout(()=>{t=null;voicePreview();},600);};
    const cancel=()=>{if(t){clearTimeout(t);t=null;}};
    b.addEventListener('pointerdown',start);
    b.addEventListener('pointerup',cancel);
    b.addEventListener('pointerleave',cancel);
    b.addEventListener('pointercancel',cancel);
  })();
  el('view-btn').onclick=()=>{const i=SEATS.indexOf(VIEW);VIEW=SEATS[(i+1)%4];toast('مقعدك: '+PLATE[VIEW].nm,'منظور جديد — توزيع جديد');startHand();};
  el('dbg-btn').onclick=()=>{DBG.on=!DBG.on;if(!DBG.on){DBG.reveal=false;DBG.paused=false;}dbgBar();renderFans();toast(DBG.on?'وضع التدقيق 🐞':'إيقاف التدقيق','');if(DBG.on===false&&G.phase==='play')playStep();};
  el('layout-btn').onclick=toggleEdit;
  // draggable design toolbar (✥ grip), position persisted
  (function(){
    const b=el('editbar');if(!b)return;
    try{const p=JSON.parse(localStorage.getItem('baloot_editbar')||'null');
      if(p&&p.l!=null){b.style.left=p.l+'px';b.style.top=p.t+'px';b.style.transform='none';}}catch(e){}
    let drag=null;
    b.addEventListener('pointerdown',ev=>{
      if(ev.target.id!=='eb-grip')return;
      const r=b.getBoundingClientRect();
      drag={dx:ev.clientX-r.left,dy:ev.clientY-r.top};
      b.setPointerCapture(ev.pointerId);ev.preventDefault();
    });
    b.addEventListener('pointermove',ev=>{
      if(!drag)return;
      b.style.transform='none';
      let l=ev.clientX-drag.dx, t=ev.clientY-drag.dy;
      l=Math.max(0,Math.min(window.innerWidth-b.offsetWidth,l));
      t=Math.max(0,Math.min(window.innerHeight-b.offsetHeight,t));
      b.style.left=l+'px';b.style.top=t+'px';
    });
    const endD=()=>{if(!drag)return;drag=null;
      try{localStorage.setItem('baloot_editbar',JSON.stringify({l:parseInt(b.style.left)||0,t:parseInt(b.style.top)||0}));}catch(e){}};
    b.addEventListener('pointerup',endD);b.addEventListener('pointercancel',endD);
  })();
  el('edit-done').onclick=toggleEdit;
  el('edit-copy').onclick=copyLayout;
  el('hand-minus').onclick=()=>{HANDCFG.scale=Math.max(0.7,+(HANDCFG.scale-0.1).toFixed(2));saveHand();renderHand();};
  el('hand-plus').onclick=()=>{HANDCFG.scale=Math.min(1.7,+(HANDCFG.scale+0.1).toFixed(2));saveHand();renderHand();};
  el('hand-close').onclick=()=>{HANDCFG.overlap=Math.min(0.85,+(((HANDCFG.overlap??0.4))+0.06).toFixed(2));saveHand();renderHand();};
  el('hand-spread').onclick=()=>{HANDCFG.overlap=Math.max(0.1,+(((HANDCFG.overlap??0.4))-0.06).toFixed(2));saveHand();renderHand();};
  el('hand-tiltp').onclick=()=>{HANDCFG.tilt=Math.min(14,+(((HANDCFG.tilt??4.5))+1).toFixed(1));saveHand();renderHand();};
  el('hand-tiltm').onclick=()=>{HANDCFG.tilt=Math.max(0,+(((HANDCFG.tilt??4.5))-1).toFixed(1));saveHand();renderHand();};
  el('hand-rotp').onclick=()=>{HANDCFG.rot=(((HANDCFG.rot??0)+5+180+360)%360)-180;saveHand();renderHand();};
  el('hand-rotm').onclick=()=>{HANDCFG.rot=(((HANDCFG.rot??0)-5+180+360)%360)-180;saveHand();renderHand();};
  el('app').addEventListener('click',(e)=>{if(G.selCard&&!e.target.closest('#hand .card'))lowerSelected();});
  el('edit-reset').onclick=resetLayout;
  const needSel=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return false;}return true;};
  el('proj-close').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].overlap=Math.min(0.85,+(((PROJCFG[SELPROJ].overlap??0.5))+0.07).toFixed(2));renderProjects();saveProj();};
  el('proj-spread').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].overlap=Math.max(0.0,+(((PROJCFG[SELPROJ].overlap??0.5))-0.07).toFixed(2));renderProjects();saveProj();};
  el('proj-tiltp').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].tilt=Math.min(22,(PROJCFG[SELPROJ].tilt??9)+2);renderProjects();saveProj();};
  el('proj-tiltm').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].tilt=Math.max(0,(PROJCFG[SELPROJ].tilt??9)-2);renderProjects();saveProj();};
  el('proj-rotp').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].rot=(((PROJCFG[SELPROJ].rot??0)+5+180+360)%360)-180;renderProjects();saveProj();};
  el('proj-rotm').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].rot=(((PROJCFG[SELPROJ].rot??0)-5+180+360)%360)-180;renderProjects();saveProj();};
  el('proj-plus').onclick=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return;}PROJCFG[SELPROJ].scale=Math.min(2.2,+(PROJCFG[SELPROJ].scale+0.15).toFixed(2));renderProjects();saveProj();};
  el('proj-minus').onclick=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return;}PROJCFG[SELPROJ].scale=Math.max(0.6,+(PROJCFG[SELPROJ].scale-0.15).toFixed(2));renderProjects();saveProj();};
  updateScores();startHand();
  setTimeout(initLayoutEditor,60);
});
</script>
</body>
</html>
