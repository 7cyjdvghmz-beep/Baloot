<title>بلوت — Saudi Baloot</title>
<style>
  :root{
    --sand:#d6c09a; --sand-d:#c4ac82;
    --rug-frame:#cdaa78; --rug-red:#a8362a; --rug-red2:#92291f;
    --green:#3b7a4f; --gold:#d8a93a; --purple:#5b4a78;
    --gold-l:#e9c46a; --gold-deep:#8a6d2f;
    --us:#2e8b57; --them:#b5482f;
    --card-bg:#fbf7ec; --red:#c0392b; --blk:#1b1b1b;
    --plate:#b89968; --plate-d:#8f7547;
    --bar:#caa84a;
  }
  /* ===== الثيمات — خمس فاتحة ومريحة للعين ===== */
  body[data-theme="raml"]{
    --sand:#efe6d6; --sand-d:#ded2bd;
    --rug-frame:#e3d5bb; --rug-red:#d8c7a8; --rug-red2:#cbb896;
    --felt-a:#f5efe3; --felt-b:#e8dfcd; --page-a:#faf7f0; --page-b:#efe8db;
    --gold:#c2a25e; --gold-l:#d9c087; --plate:#eee6d6; --plate-d:#d3c6ac;
  }
  body[data-theme="nakhil"]{
    --sand:#e4ece1; --sand-d:#cfdbcb;
    --rug-frame:#d6e2d2; --rug-red:#bfd2ba; --rug-red2:#adc4a8;
    --felt-a:#eff5ec; --felt-b:#dde8d9; --page-a:#f6faf4; --page-b:#e7efe3;
    --gold:#8fae7d; --gold-l:#b3caa4; --plate:#e8f0e5; --plate-d:#c6d5c1;
  }
  body[data-theme="samaa"]{
    --sand:#e2e9f0; --sand-d:#cbd7e3;
    --rug-frame:#d5e0ea; --rug-red:#bccfe0; --rug-red2:#a9c0d5;
    --felt-a:#eef3f8; --felt-b:#dce6ef; --page-a:#f5f9fc; --page-b:#e6eef5;
    --gold:#7fa3c4; --gold-l:#a5c2db; --plate:#e7eef5; --plate-d:#c4d3e0;
  }
  body[data-theme="lulu"]{
    --sand:#ebeaea; --sand-d:#d7d6d6;
    --rug-frame:#dedddd; --rug-red:#cac9c9; --rug-red2:#b8b7b7;
    --felt-a:#f4f4f4; --felt-b:#e6e6e6; --page-a:#fafafa; --page-b:#eeeeee;
    --gold:#9c9c9c; --gold-l:#bdbdbd; --plate:#efefef; --plate-d:#d2d2d2;
  }
  body[data-theme="ward"]{
    --sand:#f1e5e3; --sand-d:#ded0cd;
    --rug-frame:#e6d6d3; --rug-red:#d9c3bf; --rug-red2:#c9afaa;
    --felt-a:#f7efee; --felt-b:#ebdfdd; --page-a:#fbf6f5; --page-b:#f0e6e4;
    --gold:#c08f86; --gold-l:#d6ada4; --plate:#f0e6e4; --plate-d:#d5c2be;
  }
  body[data-theme] .badge,body[data-theme] .seat .nm{color:#2a2622;}
  body[data-theme] .tb{color:#2f2a24;}
  /* ظل أنعم وأوسع تحت الأوراق */
  body[data-theme] .card{box-shadow:0 6px 14px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.20) !important;}
  /* هالة أوضح لصاحب الدور */
  body[data-theme] .seat.active .avatar{
    box-shadow:0 0 0 3px rgba(233,196,106,.55), 0 0 22px 4px rgba(233,196,106,.45) !important;
    animation:pulseGlow 1.8s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 3px rgba(233,196,106,.45),0 0 16px 2px rgba(233,196,106,.35);}
                       50%{box-shadow:0 0 0 4px rgba(233,196,106,.70),0 0 26px 6px rgba(233,196,106,.60);}}
  body.art-on #rug::before{opacity:0;}
  body.art-on #rug{background:#3a1a12;box-shadow:0 16px 38px rgba(0,0,0,.45);}
  body.art-on #rugfield{background-repeat:no-repeat;}
  body.art-on .card.back{background:var(--card-back-img) center/cover !important;border-color:#e7d3a0;}
  body.art-on #topbar{background:var(--topbar-img) center/cover !important;border-color:rgba(216,169,58,.55) !important;}
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .tb-side{display:flex;gap:6px;flex:1 1 0;align-items:center;}
  .tb-side:first-of-type{justify-content:flex-start;}
  .tb-side:last-of-type{justify-content:flex-end;}
  #scorebox{flex:0 0 auto;}
  body.art-on .plate{background:linear-gradient(180deg,var(--plate),var(--plate-d)) !important;border:1px solid var(--gold) !important;color:#2a2622;}
  body.art-on .plate .rk{color:#5b5148;}
  body.art-on .avatar{background:var(--ring-img) center/cover !important;border:none !important;}
  body.art-on .avatar::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.15) 100%);}
  body.art-on .card.back::after{display:none !important;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font-family:"Tahoma","Segoe UI",system-ui,sans-serif;color:#23180c;
    background:radial-gradient(120% 120% at 50% 40%, #2a2620 0%, #15120d 100%);
    touch-action:manipulation;display:flex;align-items:center;justify-content:center;}
  /* phone frame: fills a real phone, shows a centered phone-width column on desktop */
  #app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;max-height:932px;margin:auto;
    display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 40%, var(--sand) 0%, var(--sand-d) 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.3),0 14px 55px rgba(0,0,0,.5);}

  /* ---------- Top bar ---------- */
  #topbar{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:8px 8px 4px;flex-wrap:nowrap;}
  .tb{background:linear-gradient(180deg,#6f6f6f,#4a4a4a);color:#f4f0e6;border:1px solid #2c2c2c;
    border-radius:11px;padding:8px 9px;font-size:11px;font-weight:700;text-align:center;line-height:1.15;
    box-shadow:0 2px 4px rgba(0,0,0,.35);min-width:42px;}
  .tb small{display:block;font-size:9px;opacity:.8;}
  #scorebox{background:linear-gradient(180deg,#5a5a5a,#3a3a3a);border-radius:13px;padding:5px 8px 7px;border:1px solid #222;}
  .sc-row{display:flex;gap:6px;}
  .sc{background:#1c1c1c;border-radius:9px;padding:3px 14px;text-align:center;min-width:54px;}
  .sc .h{font-size:9px;color:#cfc6b2;}
  .sc .v{font-size:20px;font-weight:800;}
  .sc.us .v{color:#7be0a6;} .sc.them .v{color:#f0a48d;}
  #scorebox .sess{text-align:center;color:#cfc6b2;font-size:10px;margin-top:2px;}

  /* ---------- Table ---------- */
  #table{flex:1;position:relative;z-index:1;}
  #rug{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
    width:min(80vw,340px);height:min(90vw,392px);border-radius:10px;
    background:var(--rug-frame);
    box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 0 2px rgba(120,80,40,.4);}
  /* diamond border pattern on frame */
  #rug::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:
      repeating-linear-gradient(45deg, var(--rug-red) 0 5px, transparent 5px 16px),
      repeating-linear-gradient(-45deg, var(--rug-red) 0 5px, transparent 5px 16px);
    opacity:.5;mix-blend-mode:multiply;}
  #rugfield{position:absolute;inset:24px;border-radius:5px;overflow:hidden;
    background:linear-gradient(180deg,var(--rug-red) 0%,var(--rug-red2) 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);}
  /* ===== نقشات الفرشة — تصاميم جديدة ===== */
  #rugfield::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;}
  #rugfield::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;}

  /* 1) ضوء المسرح — بقعة إضاءة ناعمة فوق الطاولة */
  body[data-rug="spot"] #rugfield::before{opacity:1;
    background:
      radial-gradient(75% 55% at 50% 32%, rgba(255,255,255,.42) 0%, rgba(255,255,255,.12) 45%, transparent 72%),
      radial-gradient(140% 120% at 50% 110%, rgba(0,0,0,.30), transparent 60%);}

  /* 2) حرير — موجات قطرية متداخلة */
  body[data-rug="silk"] #rugfield::before{opacity:.5;
    background:
      repeating-linear-gradient(58deg, rgba(255,255,255,.16) 0 12px, transparent 12px 40px),
      repeating-linear-gradient(-58deg, rgba(0,0,0,.08) 0 14px, transparent 14px 46px);}
  body[data-rug="silk"] #rugfield::after{opacity:1;
    background:radial-gradient(80% 60% at 50% 30%, rgba(255,255,255,.22), transparent 70%);}

  /* 3) مثمّن — بلاط هندسي متكرر */
  body[data-rug="octa"] #rugfield::before{opacity:.34;
    background:
      conic-gradient(from 45deg at 50% 50%, rgba(255,255,255,.5) 0 25%, transparent 0 50%, rgba(255,255,255,.5) 0 75%, transparent 0);
    background-size:40px 40px;}
  body[data-rug="octa"] #rugfield::after{opacity:.30;
    background:radial-gradient(circle at 50% 50%, transparent 0 12px, rgba(0,0,0,.10) 12px 13px, transparent 13px);
    background-size:40px 40px;}

  /* 4) قوس — أهلّة متداخلة على الطراز العربي */
  body[data-rug="arch"] #rugfield::before{opacity:.30;
    background:
      radial-gradient(circle at 0% 50%, transparent 0 17px, rgba(255,255,255,.55) 17px 19px, transparent 19px),
      radial-gradient(circle at 100% 50%, transparent 0 17px, rgba(255,255,255,.55) 17px 19px, transparent 19px);
    background-size:38px 38px;}

  /* 5) رخام — عروق ناعمة غير منتظمة */
  body[data-rug="marble"] #rugfield::before{opacity:.42;
    background:
      radial-gradient(60% 30% at 18% 22%, rgba(255,255,255,.40), transparent 60%),
      radial-gradient(50% 26% at 78% 40%, rgba(255,255,255,.30), transparent 62%),
      radial-gradient(70% 34% at 40% 78%, rgba(255,255,255,.26), transparent 64%),
      radial-gradient(45% 22% at 88% 84%, rgba(0,0,0,.12), transparent 60%);}

  /* 6) ماس — معيّنات محفورة */
  body[data-rug="lattice"] #rugfield::before{opacity:.30;
    background:
      repeating-linear-gradient(60deg, rgba(255,255,255,.42) 0 1.5px, transparent 1.5px 30px),
      repeating-linear-gradient(-60deg, rgba(255,255,255,.42) 0 1.5px, transparent 1.5px 30px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 30px);}

  /* 7) نجمة — زخرفة مركزية واحدة */
  body[data-rug="star"] #rugfield::before{opacity:.26;
    background:
      conic-gradient(from 0deg at 50% 42%,
        rgba(255,255,255,.55) 0 3deg, transparent 3deg 30deg,
        rgba(255,255,255,.55) 30deg 33deg, transparent 33deg 60deg,
        rgba(255,255,255,.55) 60deg 63deg, transparent 63deg 90deg,
        rgba(255,255,255,.55) 90deg 93deg, transparent 93deg 120deg,
        rgba(255,255,255,.55) 120deg 123deg, transparent 123deg 150deg,
        rgba(255,255,255,.55) 150deg 153deg, transparent 153deg 180deg,
        rgba(255,255,255,.55) 180deg 183deg, transparent 183deg 210deg,
        rgba(255,255,255,.55) 210deg 213deg, transparent 213deg 240deg,
        rgba(255,255,255,.55) 240deg 243deg, transparent 243deg 270deg,
        rgba(255,255,255,.55) 270deg 273deg, transparent 273deg 300deg,
        rgba(255,255,255,.55) 300deg 303deg, transparent 303deg 330deg,
        rgba(255,255,255,.55) 330deg 333deg, transparent 333deg 360deg);}
  body[data-rug="star"] #rugfield::after{opacity:.34;
    background:radial-gradient(circle at 50% 42%, transparent 0 52px, rgba(255,255,255,.40) 52px 54px, transparent 54px 74px, rgba(255,255,255,.24) 74px 75px, transparent 75px);}

  /* 8) إطار — حد مزدوج أنيق ووسط نظيف */
  body[data-rug="frame"] #rugfield::before{opacity:.55;
    background:
      linear-gradient(var(--gold),var(--gold)) 0 0/100% 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 0 0/2px 100% no-repeat,
      linear-gradient(var(--gold),var(--gold)) 100% 0/2px 100% no-repeat;}
  body[data-rug="frame"] #rugfield::after{opacity:.42;inset:9px;
    background:
      linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 0/100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 100%/100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 0/1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 100% 0/1px 100% no-repeat;}

  /* وضع السجادة: لوحة التحكم بلا خلفية — تطفو فوق السجادة */
  body.floor-on #topbar{background:none !important;border:none !important;box-shadow:none !important;}
  body.floor-on .tb{background:rgba(0,0,0,.28) !important;border:1px solid rgba(255,255,255,.16) !important;
    color:#f6f1e4 !important;box-shadow:none !important;}
  body.floor-on #scorebox{background:rgba(0,0,0,.30) !important;border:1px solid rgba(255,255,255,.16) !important;}
  body.floor-on #scorebox .sess{color:#e8dfc9 !important;}
  /* وضع السجادة: أخفِ الفرشة لأن الصورة تحتوي سطح اللعب */
  body.floor-on #rug{background:transparent !important;box-shadow:none !important;}
  body.floor-on #rug::before{opacity:0 !important;}
  body.floor-on #rugfield{background:transparent !important;box-shadow:none !important;}
  body.floor-on #rugfield::before,body.floor-on #rugfield::after{opacity:0 !important;}
  /* حلقة داخلية خفيفة تُبقي الحدود واضحة في كل النقشات */
  #rugfield{box-shadow:inset 0 0 0 2px rgba(255,255,255,.10);}


  /* center play zone */
  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:184px;height:200px;z-index:8;pointer-events:none;}
  .play{position:absolute;transition:transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s;}
  #play-S{bottom:0;left:50%;transform:translateX(-50%) rotate(2deg);}
  #play-N{top:0;left:50%;transform:translateX(-50%) rotate(-2deg);}
  #play-E{left:6px;top:50%;transform:translateY(-50%) rotate(-8deg);}
  #play-W{right:6px;top:50%;transform:translateY(-50%) rotate(8deg);}
  #buyer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}

  /* ---------- Seats / plates ---------- */
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;width:118px;z-index:12;}
  .avatar{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe7d4,#b9ad93);
    border:3px solid var(--plate);display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 3px 8px rgba(0,0,0,.35);position:relative;transition:.2s;}
  .seat.active .avatar{border-color:var(--gold-l);box-shadow:0 0 0 3px rgba(216,169,58,.45),0 0 16px rgba(216,169,58,.55);}

<script>
/* ============================================================
   SAUDI BALOOT — Kammelna-style MVP
   Seats: S(you)+N = team0 لنا ; W+E = team1 لهم
   Turn order ANTICLOCKWISE: S -> W(right) -> N -> E(left) -> S
   ============================================================ */
const SEATS=['S','W','N','E'];
// Perspective: VIEW = local human's seat; it always renders at the bottom.
// Physical position element-letters are S(bottom),W(left),N(top),E(right) in anticlockwise order.
let VIEW='S';
function P(seat){return SEATS[(SEATS.indexOf(seat)-SEATS.indexOf(VIEW)+4)%4];}
const TEAM={S:0,N:0,W:1,E:1};
const PLATE={
  S:{nm:'Mshari1122'}, W:{nm:'لاعب ٢'}, N:{nm:'لاعب ٣'}, E:{nm:'لاعب ٤'}
};
const SUITS=['spades','hearts','diamonds','clubs'];
const SUIT_AR={spades:'سبيت', hearts:'هاص', diamonds:'ديمن', clubs:'شيريا'};
const SUIT_SYM={spades:'♠', hearts:'♥', diamonds:'♦', clubs:'♣'};
const RED={hearts:1,diamonds:1};
const RANKS=['7','8','9','10','J','Q','K','A'];

// ---------- global error trap: capture real details for debugging on iOS ----------
window.LAST_ERRORS=JSON.parse(localStorage.getItem('baloot_lasterr')||'[]');
function trapErr(msg,src,line,col,err){
  try{
    const rec={t:new Date().toISOString().slice(5,19),msg:String(msg||'').slice(0,300),
      src:String(src||'').split('/').pop().slice(0,60),line:line||0,col:col||0,
      stack:(err&&err.stack?String(err.stack):'').slice(0,600),
      phase:(typeof G!=='undefined'&&G)?(G.phase+' t'+G.trickNo+' turn:'+G.turn+' trick:'+((G.trick||[]).length)):'-'};
    window.LAST_ERRORS.push(rec);
    window.LAST_ERRORS=window.LAST_ERRORS.slice(-6);
    localStorage.setItem('baloot_lasterr',JSON.stringify(window.LAST_ERRORS));
  }catch(e){}
}
window.addEventListener('error',e=>trapErr(e.message,e.filename,e.lineno,e.colno,e.error));
window.addEventListener('unhandledrejection',e=>trapErr('promise: '+(e.reason&&e.reason.message||e.reason),'',0,0,e.reason));
function showLastErr(){
  const L=window.LAST_ERRORS||[];
  if(!L.length){toast('لا أخطاء مسجلة ✓','');return;}
  const txt=L.map(r=>'['+r.t+'] '+r.msg+' @'+r.src+':'+r.line+':'+r.col+' | '+r.phase+(r.stack?'\n'+r.stack:'')).join('\n\n');
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('نُسخ آخر خطأ 📋',L[L.length-1].msg.slice(0,60)));return;}}catch(e){}
  window.prompt('آخر الأخطاء:',txt);
}

const CLIP_CACHE={};
function clipUrl(key){
  if(!CLIPS[key])return null;
  if(CLIP_CACHE[key])return CLIP_CACHE[key];
  // data: URI is the most reliable source on iOS Safari (blob: URLs can fail there)
  return (CLIP_CACHE[key]='data:audio/mpeg;base64,'+CLIPS[key]);
}
let CLIP_AUDIO=null,CLIP_QUEUE=[],CLIP_BUSY=false;

// reused <audio> element plays far more reliably than creating one per clip.
let AUDIO_EL=null,AUDIO_UNLOCKED=false,AUDIO_CTX=null;
function audioEl(){
  if(!AUDIO_EL){

    AUDIO_EL.preload='auto';
    AUDIO_EL.playsInline=true;
    try{AUDIO_EL.setAttribute('playsinline','');AUDIO_EL.setAttribute('webkit-playsinline','');}catch(e){}
  }
  return AUDIO_EL;
}

function nz(ctx,t,dur,freq,q,gain,type,decay){
  const sr=ctx.sampleRate,n=Math.max(1,Math.floor(sr*dur));
  const buf=ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay||3);
  const s=ctx.createBufferSource();s.buffer=buf;
  const f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=ctx.createGain();
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+dur);
}
/* لبنة نغمة هابطة */
function tn(ctx,t,f1,f2,dur,gain,type){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.01);
}

function sayKeyword(text){

    const suitKey={'سبيت':'spades','هاص':'hearts','ديمن':'diamonds','شيريا':'clubs'};
    for(const ar in suitKey){if(text.indexOf(ar)>-1){seq.push(suitKey[ar]);break;}}
    if(playClips(seq))return;
    let phrase=SAY_PRON['حكم'];
    if(text.indexOf('ثاني')>-1)phrase+=' '+SAY_PRON['ثاني'];
    for(const ar in SUIT_PRON){if(text.indexOf(ar)>-1){phrase+=' '+SUIT_PRON[ar];break;}}

  }

    'أربعمية':'arbamiyyah','بس':'bas','ولا':'wala','ورق':'waraq','ثاني':'thani','بلوت':'baloot'};

function handStrength(seat,t){let p=0,tr=0;for(const c of G.hands[seat]){if(t&&c.s===t){p+=HK_TRUMP[c.r];tr++;}else p+=SUN_VAL[c.r];}return{p,tr};}

function aiBid(seat){
  const sn=sunStrength(seat);
  const cur=G.curBid, curRank=bidRank(cur);
  if(cur&&cur.seat===seat)return{type:'pass'};
  // الدبل: يد دفاعية قوية أمام عقد الخصم
  if(canDoubleNow(seat)){
    const t=(cur.type==='hokm')?cur.suit:null;
    let pts=0,tr=0;
    for(const c of G.hands[seat]){if(t&&c.s===t){pts+=HK_TRUMP[c.r];tr++;}else pts+=SUN_VAL[c.r];}
    if(pts>=32&&(!t||tr>=2))return{type:'double'};
  }
  // candidate hokm suit: round1 only the buyer-card suit; round2 any suit (best by heuristic)
  let bestSuit=null,bp=-1,btr=0;
  const suitPool=(G.bidRound===1)?[G.buyer.s]:SUITS;
  for(const su of suitPool){const hk=handStrength(seat,su);if(hk.tr>=2&&(hk.tr>btr||(hk.tr===btr&&hk.p>bp))){bestSuit=su;bp=hk.p;btr=hk.tr;}}
  // loose prefilter (avoid simulating hopeless hands)
  const maybeSun=(sn.a>=1&&sn.p>=18)||(sn.p>=24);
  const maybeHokm=bestSuit&&(btr>=2);
  // passing is NOT free: an opponent will often buy a winning contract.
  // Base threshold 0; drop it as خربت approaches (round 2, everyone passed so far).
  let BUY_EV=0.0;
  if(G.bidRound===2&&!cur){BUY_EV=-0.15;if(G.passes>=3)BUY_EV=-0.4;}
  let best=null,bestEV=-1e9;
  try{
    if(maybeSun&&curRank<2){
      const ev=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,false,12);
      if(ev>bestEV){bestEV=ev;best={type:'sun'};}
      if(cur&&cur.type==='hokm'&&canAshkal(seat)){
        const ev2=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,true,12);
        if(ev2>bestEV){bestEV=ev2;best={type:'sun',ashkal:true};}
      }
    }
    if(maybeHokm&&curRank<1){
      const ev=simBidEV(G.hands[seat],G.buyer,'hokm',bestSuit,seat,G.firstBidder,false,12);
      if(ev>bestEV){bestEV=ev;best={type:'hokm',suit:bestSuit};}
      // round 2: also try the runner-up suit
      if(G.bidRound===2){
        let s2=null,p2=-1,t2=0;
        for(const su of SUITS){if(su===bestSuit)continue;const hk=handStrength(seat,su);
          if(hk.tr>=2&&(hk.tr>t2||(hk.tr===t2&&hk.p>p2))){s2=su;p2=hk.p;t2=hk.tr;}}
        if(s2){const ev2=simBidEV(G.hands[seat],G.buyer,'hokm',s2,seat,G.firstBidder,false,10);
          if(ev2>bestEV){bestEV=ev2;best={type:'hokm',suit:s2};}}
      }
    }
  }catch(e){best=null;}
  if(best&&bestEV>=BUY_EV)return best;

  if(!best){

    const wantHokm=bestSuit&&(btr>=4||(btr>=3&&bp>=24));
    if(wantSun&&curRank<2){
      if(cur&&cur.type==='hokm'&&canAshkal(seat))return{type:'sun',ashkal:true};

function bidRank(b){return !b?0:(b.type==='sun'?2:1);}   // sun outranks hokm
// أشكل right: only the dealer and the player to the dealer's left (the two who didn't get first buy-rights)
// أشكل right: the dealer and the seat to the dealer's LEFT in seating (= the one BEFORE the dealer

function leftOfDealer(){return SEATS[(SEATS.indexOf(G.dealer)+3)%4];} // previous seat in bidding order
function canAshkal(seat){

function applyBid(seat,bid){

    bubble(seat,pw);
    G.bidActed[seat]=true;
    if(G.curBid){
      const others=SEATS.filter(s=>s!==G.curBid.seat);
      if(others.every(s=>G.bidActed[s])){return lockContract();}
    } else {
      G.passes=(G.passes||0)+1;
      if(G.passes>=4){
        if(G.bidRound===1){ // everyone passed round 1 -> open round 2
          G.bidRound=2;G.passes=0;for(const s of SEATS)G.bidActed[s]=false;
          G.turn=G.firstBidder;toast('الجولة الثانية','Round 2');setTimeout(bidStep,900);return;
        }
        return redeal(); // all passed round 2 -> خربت
      }
    }
    G.turn=nextSeat(G.turn);setTimeout(bidStep,300);
    return;
  }
  if(bid.type==='double'){
    if(!canDoubleNow(seat))return applyBid(seat,{type:'pass'});

    G.phase='dbl';try{renderBadges();}catch(e){}                              // يمنع bidStep من إعادة رسم أزرار المزايدة فوقنا
    clearActions();

    setTimeout(()=>dblAfterDeclare(),900);
    return;
  }
  // a positive bid (sun / hokm / ashkal). Must outrank the standing contract.
  if(bidRank(bid)<=bidRank(G.curBid)){ // illegal raise -> treat as pass (safety)
    return applyBid(seat,{type:'pass'});
  }
  const isAshkal=(bid.type==='sun'&&bid.ashkal&&canAshkal(seat));
  // round-2 hokm: the SUIT stays hidden until the contract is finally confirmed
  const hideSuit=(bid.type==='hokm'&&G.bidRound===2);
  if(hideSuit&&bid.suit){(G.hokmSuitHint=G.hokmSuitHint||{})[seat]=bid.suit;}
  G.curBid={type:bid.type,suit:bid.type==='hokm'?(hideSuit?null:bid.suit):null,seat,ashkal:isAshkal};
  for(const s of SEATS)G.bidActed[s]=false;G.bidActed[seat]=true;
  renderBadges();   // انقل شارة الشراء لصاحب المزايدة الأعلى فورًا
  let label;

  else if(hideSuit)label='حكم ثاني';
  else label=(G.bidRound===2?'حكم ثاني ':'حكم ')+SUIT_AR[bid.suit];
  bubble(seat,label,1300);
  G.turn=nextSeat(seat);setTimeout(bidStep,500);
}

function dblAfterDeclare(){
  // بعد «دبل» أو «أربعة»: المدبِّل يختار مقفل/مفتوح (الحكم فقط)
  const d=G.dbl;
  if(G.curBid.type!=='hokm')return dblAskRaise();   // الصن بلا مقفل/مفتوح
  if(d.level==='three')return dblAskRaise();
  const who=d.by;
  if(who===VIEW){
    clearActions();
    actBtn('مقفل','gold',()=>{G.dbl.closed=true;clearActions();bubble(who,'مقفل',1100);try{renderBadges();}catch(e){}setTimeout(dblAskRaise,700);});
    actBtn('مفتوح','',()=>{G.dbl.closed=false;clearActions();bubble(who,'مفتوح',1100);try{renderBadges();}catch(e){}setTimeout(dblAskRaise,700);});
    toast('نوع اللعب','مقفل = ممنوع التربيع');
  }else{
    const closed=aiClosedChoice(who);
    G.dbl.closed=closed;bubble(who,closed?'مقفل':'مفتوح',1100);try{renderBadges();}catch(e){}
    setTimeout(dblAskRaise,900);
  }
}
function dblAskRaise(){
  // من يزايد بعد المستوى الحالي؟ التحدي بين المشتري والمدبِّل حصرًا
  const d=G.dbl,buyer=buyerSeat();
  const next={double:'three',three:'four',four:'gahwa'}[d.level];
  if(!next)return dblDone();
  const who=(next==='three'||next==='gahwa')?buyer:d.by;   // ثلاثة وقهوة للمشتري، أربعة للمدبِّل
  if(who===VIEW){
    clearActions();
    actBtn(DBL_AR[next],'gold',()=>{clearActions();dblRaise(next,who);});
    actBtn('بس','ghost',()=>{clearActions();dblDone();});
  }else{
    setTimeout(()=>{
      if(aiWantsRaise(who,next))dblRaise(next,who);else dblDone();
    },800);
  }
}
function dblRaise(lvl,who){
  G.dbl.level=lvl;G.dbl.by=who;G.dbl.byTeam=TEAM[who];   // الشارة تنتقل لمن رفع المستوى
  dblSay(who,lvl);try{renderBadges();}catch(e){}
  if(lvl==='gahwa'){setTimeout(dblDone,1000);return;}
  if(lvl==='four'){setTimeout(dblAfterDeclare,900);return;}   // الأربعة تعيد خيار مقفل/مفتوح للمدبِّل
  setTimeout(dblAskRaise,900);                                 // الثلاثة مفتوحة دائمًا
}
function dblDone(){
  clearActions();
  G.phase='bid';                                // نعيد الطور ليكمل finishDeal طبيعيًا
  const b=G.curBid;
  // «حكم ثاني» مدبول: اللون ما زال مخفيًا — يُختار الآن، وبلا خيار صن (الدبل يمنع القلب)
  if(b.type==='hokm'&&!b.suit){
    G.turn=b.seat;
    if(b.seat===VIEW&&!DBG.master)return showFinalSuitPicker(false);
    const su=aiPickFinalSuit(b.seat);
    return setTimeout(()=>finalizeHokmSuit(su),700);
  }
  G.mode=b.type;G.trump=b.type==='hokm'?b.suit:null;G.declarer=b.seat;
  finishDeal();
}
function aiClosedChoice(seat){
  // يقفل إذا كان قليل الحكم (يمنع خصمه من استغلال أحكامه)
  try{
    const b=G.curBid;
    const t=G.trump||(b&&b.type==='hokm'?(b.suit||(G.hokmSuitHint&&G.hokmSuitHint[b.seat])):null);
    if(!t)return false;
    const mine=G.hands[seat].filter(c=>c.s===t).length;
    return mine<=1;   // معي حكم قليل → أقفل لأمنع خصمي من استغلال أحكامه
  }catch(e){return false;}
}
function aiWantsRaise(seat,next){
  // تقدير بسيط: يصعّد فقط بيد قوية جدًا من منظوره
  try{
    const t=G.trump;
    let pts=0,tr=0;
    for(const c of G.hands[seat]){if(t&&c.s===t){pts+=HK_TRUMP[c.r];tr++;}else pts+=SUN_VAL[c.r];}
    const need={three:34,four:40,gahwa:48}[next]||99;
    return pts>=need&&(!t||tr>=2);
  }catch(e){return false;}
}
function lockContract(){
  const b=G.curBid;
  if(b.type==='hokm'&&!b.suit){
    // round-2 hokm won the bidding but the suit was never revealed — resolve it now
    G.turn=b.seat;
    if(b.seat===VIEW&&!DBG.master){toast('اختر لون الحكم','');showFinalSuitPicker();}
    else if(b.seat===VIEW&&DBG.master){const r0=aiResolveFinal(VIEW);setTimeout(()=>{if(r0.sun)finalizeAsSun();else finalizeHokmSuit(r0.suit);},700);}
    else{const r=aiResolveFinal(b.seat);setTimeout(()=>{if(r.sun)finalizeAsSun();else finalizeHokmSuit(r.suit);},700);}
    return;
  }
  G.mode=b.type;G.trump=b.type==='hokm'?b.suit:null;G.declarer=b.seat;
  finishDeal();
}
function finalizeHokmSuit(suit){
  G.curBid.suit=suit;
  bubble(G.curBid.seat,'حكم ثاني '+SUIT_AR[suit],1300);
  G.mode='hokm';G.trump=suit;G.declarer=G.curBid.seat;
  finishDeal();
}
function showFinalSuitPicker(allowSun){
  clearActions();
  const exclude=G.buyer.s; // round2: hide the floor-card suit
  if(allowSun!==false)actBtn('صن','gold',()=>{clearActions();finalizeAsSun();});
  for(const su of SUITS){if(su===exclude)continue;actBtn(suitLabel(su),'',()=>{clearActions();finalizeHokmSuit(su);});}
  toast('اختر لون الحكم','');
}
function finalizeAsSun(){
  G.curBid.type='sun';G.curBid.suit=null;
  bubble(G.curBid.seat,'صن',1300);
  G.mode='sun';G.trump=null;G.declarer=G.curBid.seat;
  finishDeal();
}
function aiPickFinalSuit(seat){
  const hint=G.hokmSuitHint&&G.hokmSuitHint[seat];
  if(hint)return hint;
  let bestSuit=G.buyer.s,bp=-1,btr=-1;
  for(const su of SUITS){if(su===G.buyer.s)continue;const hk=handStrength(seat,su);
    if(hk.tr>btr||(hk.tr===btr&&hk.p>bp)){bestSuit=su;bp=hk.p;btr=hk.tr;}}
  return bestSuit;
}
function aiResolveFinal(seat){
  // reconsider صن vs the hinted hokm suit now that bidding is fully settled
  const su=aiPickFinalSuit(seat);
  try{
    const evH=simBidEV(G.hands[seat],G.buyer,'hokm',su,seat,G.firstBidder,false,10);
    const sn=sunStrength(seat);
    if(sn.a>=1&&sn.p>=18){
      const evS=simBidEV(G.hands[seat],G.buyer,'sun',null,seat,G.firstBidder,false,10);
      if(evS>evH)return{sun:true};
    }
  }catch(e){}
  return{sun:false,suit:su};
}
function redeal(){MATCH.dealer=nextSeat(MATCH.dealer);setTimeout(startHand,1100);}
function finishDeal(){
  // who receives the face-up (الأرض): the declarer, OR his partner if the contract is أشكل
  const taker=(G.curBid&&G.curBid.ashkal)?partnerOf(G.declarer):G.declarer;
  G.hands[taker].push(G.buyer);
  G.floorTo=taker; // everyone saw the floor card and knows who holds it
  const fill={[taker]:2};for(const s of SEATS)if(!(s in fill))fill[s]=3;
  let r=0;for(const seat of G.order)for(let k=0;k<fill[seat];k++)G.hands[seat].push(G.rest[r++]);
  for(const s of SEATS)sortHand(s);
  renderBuyer(false);G.phase='play';G.turn=G.firstBidder;G.trickNo=1;
  G.void={S:{},W:{},N:{},E:{}};G.signal={};G.history=[];
  detectProjects();G.justDealt=true;renderAll();renderBadges();updateModePill();
  setTimeout(playStep,500);
}
function cardOrder(c){return (G.mode==='hokm'&&c.s===G.trump)?ORD_TRUMP.indexOf(c.r):ORD_PLAIN.indexOf(c.r);}
const HAND_SUIT_ORDER=['diamonds','spades','hearts','clubs'];  // أحمر/أسود بالتناوب
function sortHand(seat){G.hands[seat].sort((a,b)=>a.s!==b.s?HAND_SUIT_ORDER.indexOf(a.s)-HAND_SUIT_ORDER.indexOf(b.s):cardOrder(a)-cardOrder(b));}

/* ---------- projects ---------- */
function detectProjects(){
  G.ownerProjects={};G.seatProjects={};G.declared={};G.declaredDone={};
  for(const seat of SEATS) G.seatProjects[seat]=findProjects(G.hands[seat]);
}
function findProjects(hand){
  const res=[],bySuit={};
  for(const c of hand)(bySuit[c.s]=bySuit[c.s]||[]).push(c);
  for(const s in bySuit){
    const cards=bySuit[s].slice().sort((a,b)=>ORD_SEQ.indexOf(a.r)-ORD_SEQ.indexOf(b.r));
    let start=0;
    for(let i=1;i<=cards.length;i++){
      const cons=i<cards.length&&ORD_SEQ.indexOf(cards[i].r)===ORD_SEQ.indexOf(cards[i-1].r)+1;
      if(!cons){
        const run=i-start, seq=cards.slice(start,i), top=ORD_SEQ.indexOf(cards[i-1].r);
        if(run>=5)res.push({name:'مية',pts:100,top,cards:seq});
        else if(run===4)res.push({name:'خمسين',pts:50,top,cards:seq});
        else if(run===3)res.push({name:'سرا',pts:20,top,cards:seq});
        start=i;
      }
    }
  }
  const byRank={};for(const c of hand)(byRank[c.r]=byRank[c.r]||[]).push(c);
  for(const r in byRank)if(byRank[r].length===4){
    if(r==='A'&&G.mode==='sun')res.push({name:'أربعمية',pts:400,top:99,cards:byRank[r]});
    else if(['10','J','Q','K','A'].includes(r))res.push({name:'مية',pts:100,top:90+ORD_SEQ.indexOf(r),cards:byRank[r]});
  }
  return res;
}
function declarePhase(seat){
  const found=G.seatProjects[seat]||[];
  if(seat!==VIEW||DBG.master){
    // AI announces every project it holds
    G.declared[seat]=found.slice();G.declaredDone[seat]=true;
    setTimeout(playStep,120);
    return;
  }
  G.projPick={'سرا':0,'خمسين':0,'مية':0,'أربعمية':0};
  showProjectChoice();highlightPlayable();
}

const DBL_MULT={double:2,three:3,four:4,gahwa:4};
const DBL_AR={double:'دبل',three:'ثري',four:'فور',gahwa:'قهوة'};
const DBL_CLIP={double:'double',three:'three',four:'four',gahwa:'gahwa'};
// شارة حالة الدبل: تبقى ظاهرة طوال اليد المدبولة
function dblStatusText(){
  try{
    const d=G&&G.dbl;if(!d||!d.level)return '';
    let t=DBL_AR[d.level];
    if(d.level!=='gahwa'&&(G.mode==='hokm'||(G.curBid&&G.curBid.type==='hokm')))t+=' · '+(d.closed?'مقفل':'مفتوح');
    return t;
  }catch(e){return '';}
}
function teamScore(t){return t===0?MATCH.us:MATCH.them;}
// من يحق له الدبل: الحكم دائمًا، والصن فقط إذا كان المشتري ≥١٠٠ والمدبِّل تحتها
function canDoubleNow(seat){
  const b=G.curBid;if(!b||!G.dbl||G.dbl.level)return false;
  const buyerTeam=TEAM[b.ashkal?partnerOf(b.seat):b.seat];
  if(TEAM[seat]===buyerTeam)return false;
  if(b.type==='hokm')return true;
  return teamScore(buyerTeam)>=100 && teamScore(TEAM[seat])<100;
}
const PROJ_MAX={'سرا':2,'خمسين':2,'مية':2,'أربعمية':1};
function showProjectChoice(){
  clearActions();
  const types = G.mode==='sun' ? ['سرا','خمسين','مية','أربعمية'] : ['سرا','خمسين','مية'];
  const pick=G.projPick||(G.projPick={'سرا':0,'خمسين':0,'مية':0,'أربعمية':0});
  for(const name of types){
    const n=pick[name]||0;
    const label=n?(name+' ×'+n):name;
    actBtn(label,n?'gold':'',()=>{
      // every button cycles freely; a project that isn't really held simply never scores
      const mx=PROJ_MAX[name]||1;
      pick[name]=((pick[name]||0)+1)>mx?0:(pick[name]||0)+1;
      showProjectChoice();               // keep the panel visible with updated counters
    });
  }
  actBtn('✔ تم','ghost',()=>confirmProjects());
  toast('مشروعك','اضغط لزيادة العدد · ثم «تم»');
}
function confirmProjects(){
  clearActions();
  const pick=G.projPick||{};
  const mine=(G.seatProjects[VIEW]||[]).slice();
  const out=[];
  for(const name in pick){
    const n=pick[name]||0;if(!n)continue;
    const cands=mine.filter(p=>p.name===name).sort((a,b)=>b.top-a.top);
    // a claim is announced freely, but only a real project ever scores — silently
    const take=Math.min(n,cands.length);
    for(let i=0;i<take;i++)out.push(cands[i]);
  }
  G.declared[VIEW]=out;G.declaredDone[VIEW]=true;
  playStep();
}
function declaredList(seat){const d=G.declared[seat];if(!d)return[];return Array.isArray(d)?d:[d];}
function computeProjectWinner(){
  const best={0:null,1:null};
  for(const seat of SEATS){const t=TEAM[seat];
    for(const it of declaredList(seat)){
      if(!best[t]||it.pts>best[t].it.pts||(it.pts===best[t].it.pts&&it.top>best[t].it.top))best[t]={it,seat};}}
  let w=null;
  if(best[0]&&best[1]) w=(best[0].it.pts>best[1].it.pts||(best[0].it.pts===best[1].it.pts&&best[0].it.top>=best[1].it.top))?0:1;
  else if(best[0])w=0;else if(best[1])w=1;
  G.ownerProjects={};G.projectPoints=0;G.projectWinner=w;
  if(w!==null){
    let tot=0,names=[];
    for(const seat of SEATS){if(TEAM[seat]!==w)continue;
      const list=declaredList(seat);if(!list.length)continue;
      let cards=[];
      for(const it of list){tot+=it.pts;names.push(it.name);if(it.cards)cards=cards.concat(it.cards);}
      const lbl=list.length>1?(list.length+' مشاريع'):list[0].name;
      G.ownerProjects[seat]={name:lbl,cards};}
    G.projectPoints=tot;
    setTimeout(()=>toast('مشاريع '+(w===0?'لنا':'لهم'),names.join(' + ')+' · '+tot),300);
  }
}
function projectsVisible(){return G.phase==='play'&&G.trickNo>=2;}

/* ---------- play ---------- */
function trumpSuit(){return G.mode==='hokm'?G.trump:null;}
function rankStrength(c,lead){const t=trumpSuit();if(t&&c.s===t)return 200+ORD_TRUMP.indexOf(c.r);if(c.s===lead)return 100+ORD_PLAIN.indexOf(c.r);return ORD_PLAIN.indexOf(c.r);}
function legalCards(seat){
  const h=G.hands[seat];
  if(!G.trick.length){
    // اللعب المقفل: ممنوع فتح الحكم إلا إذا لم يبقَ بيدك غيره
    if(G.dbl&&G.dbl.closed&&G.mode==='hokm'&&G.trump){
      const nonT=h.filter(c=>c.s!==G.trump);
      if(nonT.length)return nonT;
    }
    return h.slice();
  }
  const lead=G.trick[0].card.s;
  const fol=h.filter(c=>c.s===lead);
  if(fol.length){
    // الحكم مفتوح: التعلية إجبارية فوق أعلى حكم للخصم إن أمكن (لا إجبار فوق الشريك)
    const ts0=trumpSuit();
    if(ts0&&lead===ts0){
      let top=null,tw=null;
      for(const p of G.trick){if(p.card.s===ts0&&(!top||ORD_TRUMP.indexOf(p.card.r)>ORD_TRUMP.indexOf(top.r))){top=p.card;tw=p.seat;}}
      if(top&&TEAM[tw]!==TEAM[seat]){
        const over=fol.filter(c=>ORD_TRUMP.indexOf(c.r)>ORD_TRUMP.indexOf(top.r));
        if(over.length)return over;
      }
    }
    return fol; // must follow suit
  }
  const ts=trumpSuit();
  if(!ts)return h.slice(); // sun: any card
  // hokm: out of led suit
  // find current trick winner
  let ws=null,wstr=-1;
  for(const p of G.trick){const x=rankStrength(p.card,lead);if(x>wstr){wstr=x;ws=p.seat;}}
  const partnerWin=ws&&TEAM[ws]===TEAM[seat];
  const myTrumps=h.filter(c=>c.s===ts);
  if(partnerWin)return h.slice(); // partner winning -> may discard freely
  if(!myTrumps.length)return h.slice(); // no trump -> may discard
  // must trump; over-trump if possible
  const trumpsOnTable=G.trick.filter(p=>p.card.s===ts);
  if(trumpsOnTable.length){
    const topT=trumpsOnTable.reduce((a,b)=>ORD_TRUMP.indexOf(b.card.r)>ORD_TRUMP.indexOf(a.card.r)?b:a).card;
    const over=myTrumps.filter(c=>ORD_TRUMP.indexOf(c.r)>ORD_TRUMP.indexOf(topT.r));
    return over.length?over:h.slice(); // can't over-trump → free (no forced under-trump)
  }
  return myTrumps; // no trump on the table yet -> must play one
}
function playStep(){
  if(G.phase!=='play')return;
  setActive(G.turn);renderBadges();
  if(G.trickNo===1 && !G.declaredDone[G.turn]) return declarePhase(G.turn);
  if(G.turn===VIEW){highlightPlayable();return;}
  if(DBG.paused||DBG.master)return; // coach/master mode: wait for manual play
  setTimeout(()=>{
    if(DBG.paused||DBG.master)return;
    try{playCard(G.turn,aiPlay(G.turn));}
    catch(e){trapErr('aiTurn: '+e.message,'',0,0,e);
      try{const l=legalCards(G.turn);if(l.length)playCard(G.turn,l[0]);}catch(e2){trapErr('aiTurn-recovery: '+e2.message,'',0,0,e2);}}
  },700);
}
function playedCards(){const a=[];for(const t of[0,1])a.push(...G.tricksWon[t]);for(const p of G.trick)a.push(p.card);return a;}
function partnerOf(seat){for(const s of SEATS)if(s!==seat&&TEAM[s]===TEAM[seat])return s;return null;}
// is `card` the highest still-outstanding card of `suit` (nobody else can beat it if led)
function isMaster(card,suit,played,seat){

      // how many cards outrank my top and are still out?
      const su=run.cards[0].s;const mine=new Set(st.hands[seat].filter(c=>c.s===su).map(c=>c.r));
      let hi=0;for(const r of RANKS){if(mine.has(r)||seen.has(su+r))continue;if(ORD_PLAIN.indexOf(r)>ORD_PLAIN.indexOf(topC.r))hi++;}
      // near-solid run: only one card above AND all honors (J+), 3+ long → keep it
      const allHonors=run.cards.every(c=>ORD_PLAIN.indexOf(c.r)>=ORD_PLAIN.indexOf('J'));
      if(run.cards.length>=3&&hi<=1&&allHonors)continue;
      const cand=run.cards.filter(c=>legal.some(l=>l.s===c.s&&l.r===c.r));
      if(cand.length){const lo=cand.slice().sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r))[0];
        if(!bestRun||run.pts>bestRun.pts)bestRun={pts:run.pts,c:lo,cards:run.cards.slice()};}
    }
    if(bestRun){
      // keep the run intact (lead a low singleton) ONLY if the run is near-solid:
      // its top is K+, and few cards outrank it (so it will dominate soon anyway)
      const su=bestRun.c.s;
      const runCards=bestRun.cards?bestRun.cards.slice():st.hands[seat].filter(c=>c.s===su);
      const topR=runCards.reduce((a,b)=>ORD_PLAIN.indexOf(b.r)>ORD_PLAIN.indexOf(a.r)?b:a);
      const mineSet=new Set(runCards.map(c=>c.r));let above=0;
      for(const r of RANKS){if(mineSet.has(r)||seen.has(su+r))continue;if(ORD_PLAIN.indexOf(r)>ORD_PLAIN.indexOf(topR.r))above++;}
      const nearSolid=runCards.length>=3&&(topR.r==='K'||topR.r==='A')&&above<=2;
      if(nearSolid){
        const cnt={};for(const c of st.hands[seat])if(!isT(c))cnt[c.s]=(cnt[c.s]||0)+1;
        const singles=legal.filter(c=>!isT(c)&&cnt[c.s]===1&&c.s!==su&&!simIsMaster(st,seat,c)&&val(c)<=10);
        if(singles.length){singles.sort((a,b)=>val(a)-val(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
          return{c:singles[0],why:'فتح بورقة مفردة وحفظ السرا'};}
      }
      return{c:bestRun.c,why:'فتح بأصغر ورقة من السرا'};
    }
    // مثلوث: 3+ cards of a suit with a strong top (K or above, not yet a master) → lead its LOWEST
    {
      const by={};for(const c of legal){if(isT(c))continue;(by[c.s]=by[c.s]||[]).push(c);}
      let bs=null,bt=-1;
      for(const s in by){
        if(by[s].length<3)continue;
        const topC=by[s].reduce((a,b)=>ORD_PLAIN.indexOf(b.r)>ORD_PLAIN.indexOf(a.r)?b:a);
        const top=ORD_PLAIN.indexOf(topC.r);
        if(top<ORD_PLAIN.indexOf('K'))continue;
        if(simIsMaster(st,seat,topC))continue;                        // top already free → cash instead
        // near-solid long holding (4+, only one card above): keep it
        const mine=new Set(by[s].map(c=>c.r));let hi=0;
        for(const r of RANKS){if(mine.has(r)||seen.has(s+r))continue;if(ORD_PLAIN.indexOf(r)>top)hi++;}
        const allHigh=(topC.r==='K'||topC.r==='A');
        if(by[s].length>=3&&hi<=1&&allHigh)continue;
        if(top>bt&&!simRuffRiskLead(st,seat,s)){bt=top;bs=s;}
      }
      if(bs){
        const cs=by[bs].sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
        return{c:cs[0],why:'مثلوث: تحرير الورقة الكبيرة'};
      }
    }
    if(masters.length){sortMastersStrongFirst(masters,st.mode,st.trump,val);return{c:masters[0],why:'صرف ورقة آكلة (الأكبر أولاً)'};}
    // لا ماستر عندي: أخدم مشروع شريكي أو إكة الأرض عنده، وأتجنّبهما عند الخصم
    {
      const pSeat=partnerOf(seat);
      const prP=st.reveal&&st.reveal[pSeat]&&st.reveal[pSeat].suit;
      if(prP&&(st.mode!=='hokm'||prP!==st.trump)){
        const cs=legal.filter(c=>c.s===prP&&!isT(c)).sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
        if(cs.length)return{c:cs[0],why:'خدمة مشروع الشريك'};
      }
      const fl=st.floor;
      if(fl&&fl.r==='A'&&fl.to===pSeat&&(st.mode!=='hokm'||fl.s!==st.trump)){
        const cs=legal.filter(c=>c.s===fl.s&&!isT(c)).sort((a,b)=>ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
        if(cs.length)return{c:cs[0],why:'تغذية إكة الأرض عند الشريك'};
      }
    }
    const oppProj=new Set();
    for(const o of oppSeats(seat)){const rp=st.reveal&&st.reveal[o];if(rp&&rp.suit)oppProj.add(rp.suit);}
    if(st.floor&&st.floor.r==='A'&&TEAM[st.floor.to]!==TEAM[seat])oppProj.add(st.floor.s);
    // otherwise a low non-trump; prefer SHORT suits, then cards closest to mastery
    const slen=s=>st.hands[seat].filter(x=>x.s===s).length;
    const outAbove=c=>{const mine=new Set(st.hands[seat].filter(x=>x.s===c.s).map(x=>x.r));
      let n=0;for(const r of RANKS){if(r===c.r||mine.has(r)||seen.has(c.s+r))continue;
        if(ORD_PLAIN.indexOf(r)>ORD_PLAIN.indexOf(c.r))n++;}return n;};
    let nt=legal.filter(c=>!isT(c));
    const ntSafe=nt.filter(c=>!oppProj.has(c.s));
    if(ntSafe.length)nt=ntSafe; // لا تطعم لون مشروع الخصم إن وُجد بديل
    nt.sort((a,b)=>val(a)-val(b)||slen(a.s)-slen(b.s)||outAbove(a)-outAbove(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
    if(nt.length)return{c:nt[0],why:'أصغر ورقة (تجنّب حكم الخصم)'};
    legal.sort((a,b)=>val(a)-val(b));return{c:legal[0],why:'أصغر ورقة'};
  }
  // ---------- following a trick (position-aware) ----------
  let ws=null,wstr=-1;for(const p of st.trick){const x=simStr(st.mode,st.trump,lead,p.card);if(x>wstr){wstr=x;ws=p.seat;}}
  const partnerWin=ws&&TEAM[ws]===TEAM[seat];
  // تربيع: forced to trump (out of suit, opp winning) and my partner bought the hokm & trumps still outside → trump with my BIGGEST
  if(st.mode==='hokm'&&!partnerWin&&st.declarer!=null&&TEAM[st.declarer]===TEAM[seat]&&seat!==st.declarer){
    const allTrump=legal.length&&legal.every(c=>c.s===st.trump);
    if(allTrump){
      let mineT=st.hands[seat].filter(c=>c.s===st.trump).length,seenT2=0;
      simSeenAll(st).forEach(k=>{if(k.slice(0,st.trump.length)===st.trump)seenT2++;});
      const oppHasT=oppSeats(seat).some(o=>!st.void[o][st.trump]);
      if(8-mineT-seenT2>0&&oppHasT){
        const big=legal.slice().sort((a,b)=>ORD_TRUMP.indexOf(b.r)-ORD_TRUMP.indexOf(a.r))[0];
        return{c:big,why:'تربيع: مساعدة الشريك بطرح الحكم'};
      }
    }
  }
  const isT=c=>(st.mode==='hokm'&&c.s===st.trump);
  const seenAll=simSeenAll(st);
  const pos=st.trick.length;            // 1=2nd hand, 2=3rd hand, 3=4th hand
  const voidLead=!legal.some(c=>c.s===lead);
  const trickPts=st.trick.reduce((a,p)=>a+simVal(st.mode,st.trump,p.card),0);
  const myMaster=c=>simIsMaster(st,seat,c);
  let trumpOutside=0;
  if(st.mode==='hokm'){let mineT=st.hands[seat].filter(isT).length,seenT=0;
    seenAll.forEach(k=>{if(k.slice(0,st.trump.length)===st.trump)seenT++;});
    trumpOutside=8-mineT-seenT;}
  // seats still to act after me (always opponents when partner already played)
  const after=[];{let q=nextSeat(seat);while(after.length<3-pos){after.push(q);q=nextSeat(q);}}
  const ruffPossible=su=>st.mode==='hokm'&&su!==st.trump&&trumpOutside>0&&after.some(a=>st.void[a][su]&&!st.void[a][st.trump]);
  // helpers ----------------------------------------------------------------
  function junkPick(pool){
    // choose the least harmful junk card:
    // pen2 = last low guard of a NEAR-master (e.g. the 8 protecting a 10 under a lone ace)
    // pen1 = suit contains one of my masters
    const nm=pool.filter(c=>!isT(c)&&!myMaster(c));
    const base=nm.length?nm:pool.filter(c=>!isT(c));
    const fin=(base.length?base:pool).slice();
    const slen=s=>st.hands[seat].filter(x=>x.s===s).length;
    const pen=c=>{
      let p=0;
      const suitCards=st.hands[seat].filter(x=>x.s===c.s);
      if(suitCards.some(x=>myMaster(x)))p=Math.max(p,1);
      const lows=suitCards.filter(x=>ORD_PLAIN.indexOf(x.r)<ORD_PLAIN.indexOf('J'));
      const nearM=suitCards.some(x=>!myMaster(x)&&outHigher(x)===1);
      if(nearM&&lows.length===1&&lows[0].s===c.s&&lows[0].r===c.r)p=Math.max(p,2);
      return p;};
    fin.sort((a,b)=>val(a)-val(b)||pen(a)-pen(b)||slen(a.s)-slen(b.s)||outHigher(a)-outHigher(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
    return fin[0];}
  function lowestSafe(pool){return junkPick(pool);}
  function signalDiscard(pool){
    // consider EVERY suit where I hold a master; signal with the PAIR of the best signal-able one
    const cands=[];
    for(const c of st.hands[seat]){
      if(isT(c))continue;
      if(!myMaster(c))continue;
      const pairS=SUITPAIR[c.s];
      if(st.mode==='hokm'&&pairS===st.trump)continue;      // pair is trump → can't signal it
      const disc=pool.filter(x=>x.s===pairS&&!isT(x)&&!myMaster(x));
      if(!disc.length)continue;
      disc.sort((a,b)=>val(a)-val(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
      cands.push({rank:ORD_PLAIN.indexOf(c.r),card:disc[0]});
    }
    if(!cands.length)return null;
    cands.sort((a,b)=>b.rank-a.rank);
    return cands[0].card;}
  function aceDumpAllowed(c){
    // protect only the BOSS of the suit (my highest card there, when it's a master).
    const higherMine=st.hands[seat].some(x=>x.s===c.s&&ORD_PLAIN.indexOf(x.r)>ORD_PLAIN.indexOf(c.r));
    if(higherMine)return true;                                      // I hold a higher one → this is dumpable
    if(!(c.r==='A'||myMaster(c)))return true;
    // redundant boss: another master of the SAME suit stays with me → this one may be loaded
    if(c.r!=='A'&&myMaster(c)&&st.hands[seat].some(x=>x.s===c.s&&x.r!==c.r&&myMaster(x)))return true;
    if(st.hands[seat].length<=3)return true;                       // last 3 tricks
    let mine=st.hands[seat].filter(x=>x.s===c.s).length,seenN=0;
    seenAll.forEach(k=>{if(k.slice(0,c.s.length)===c.s)seenN++;});
    if(8-mine-seenN===0)return true;                                // suit dead elsewhere
    const others=legal.filter(x=>!(x.s===c.s&&x.r===c.r));
    if(others.length>0&&others.every(myMaster))return true;         // السواء
    return false;}
  function outHigher(c){ // ranks above c (its suit) that are neither mine nor seen
    const ord=isT(c)?ORD_TRUMP:ORD_PLAIN;
    const mine=new Set(st.hands[seat].filter(x=>x.s===c.s).map(x=>x.r));
    let n=0;for(const r of RANKS){if(r===c.r||mine.has(r)||seenAll.has(c.s+r))continue;
      if(ord.indexOf(r)>ord.indexOf(c.r))n++;}
    return n;}
  function inSeqRun(c){ // part of a 3+ consecutive (natural order) run in my hand
    const rs=new Set(st.hands[seat].filter(x=>x.s===c.s).map(x=>ORD_SEQ.indexOf(x.r)));
    const i=ORD_SEQ.indexOf(c.r);
    for(let s0=i-2;s0<=i;s0++){if(rs.has(s0)&&rs.has(s0+1)&&rs.has(s0+2))return true;}
    return false;}
  // -------------------------------------------------------------------------
  if(partnerWin){
    const pCard=st.trick.find(p=>p.seat===ws).card;
    // judge partner's card from MY public info: nothing unseen-or-in-my-hand can beat it
    const pMasterCheck=(card)=>{
      const ord=(st.mode==='hokm'&&card.s===st.trump)?ORD_TRUMP:ORD_PLAIN;
      const mine=new Set(st.hands[seat].filter(c=>c.s===card.s).map(c=>c.r));
      for(const r of RANKS){if(r===card.r||seenAll.has(card.s+r))continue;
        if(!mine.has(r)&&ord.indexOf(r)>ord.indexOf(card.r))return false;}
      return true;};
    const pMaster=(pCard.s===lead&&pMasterCheck(pCard))||(isT(pCard)&&pMasterCheck(pCard));
    // following partner's TRUMP lead (he's pulling/flushing) — table convention:
    if(st.mode==='hokm'&&lead===st.trump){
      const myTr=legal.filter(c=>c.s===st.trump);
      if(myTr.length){
        if(!pMaster){ // partner is flushing the boss → squeeze with my BIGGEST trump
          const big=myTr.slice().sort((a,b)=>ORD_TRUMP.indexOf(b.r)-ORD_TRUMP.indexOf(a.r))[0];
          return{c:big,why:'تربيع خلف سحب الشريك'};
        }
        // partner's trump is the boss → load my fattest trump under it,
        // but NEVER my own boss trump: it wins a whole extra trick later
        const loadable=myTr.filter(c=>!myMaster(c));
        if(loadable.length){
          loadable.sort((a,b)=>val(b)-val(a)||ORD_TRUMP.indexOf(b.r)-ORD_TRUMP.indexOf(a.r));
          return{c:loadable[0],why:'تحميل على سحب الشريك'};
        }
        const small=myTr.slice().sort((a,b)=>ORD_TRUMP.indexOf(a.r)-ORD_TRUMP.indexOf(b.r));
        return{c:small[0],why:'حفظ البوس خلف الشريك'};
      }
    }
    const safeWin=(pos===3)||(pMaster&&!ruffPossible(lead));
    if(safeWin){
      if(!voidLead){
        // partner declared a project and is winning with a MASTER of its suit:
        // my high card (esp. the 10) blocks his run — feed the fattest to unblock it
        {
          const pr=st.reveal&&st.reveal[ws];
          if(pMaster&&pr&&(pr.suit===lead||!pr.suit)){
            const big=legal.filter(c=>c.s===lead)
              .sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
            if(big.length)return{c:big[0],why:'تسليك سرا الشريك'};
          }
        }
        // forced to follow: load the fattest allowed card of the suit
        // when I'm LAST, partner's win is certain → bank the fattest card, Ace included
        if(pos===3){
          let all=legal.slice();
          const keepBoss=all.filter(c=>!(isT(c)&&myMaster(c)));  // boss trump wins its own trick later
          if(keepBoss.length)all=keepBoss;
          all.sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
          return{c:all[0],why:'تحميل نقاط للشريك'};
        }
        let pool=legal.filter(c=>!isT(c)&&aceDumpAllowed(c));
        if(st.hands[seat].length<=3) // آخر ٣: keep non-Ace (near)masters — they still win tricks
          pool=pool.filter(c=>c.r==='A'||outHigher(c)>=2);
        if(pool.length){pool.sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
          const pick=pool[0];
          return{c:pick,why:(pick.r==='A'?'تهريب الإكة للشريك (آمن)':'تحميل نقاط للشريك')};}
        return{c:lowestSafe(legal),why:'رمية محايدة'};
      }
      // free discard on partner's SAFE trick:
      // 1) تهريب آمن للإكة/الماستر (آخر ٣ / اللون ميت / السواء)
      {
        const smuggleOK=(c)=>{
          if(st.hands[seat].length<=3)return true;
          let mine=st.hands[seat].filter(x=>x.s===c.s).length,seenN=0;
          seenAll.forEach(k=>{if(k.slice(0,c.s.length)===c.s)seenN++;});
          if(8-mine-seenN===0)return true;
          const others=legal.filter(x=>!(x.s===c.s&&x.r===c.r));
          return others.length>0&&others.every(myMaster);};
        const sm=legal.filter(c=>!isT(c)&&(c.r==='A'||myMaster(c))&&smuggleOK(c));
        if(sm.length){sm.sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
          return{c:sm[0],why:'تهريب الإكة للشريك (آمن)'};}
      }
      // 2) تحميل بإشارة: أعلى ورقة آمنة من زوج لوني القوي (نقاط + إشارة)
      {
        let want=null,bestRank=-1;
        for(const c of st.hands[seat]){
          if(isT(c)||!myMaster(c))continue;
          const pairS=SUITPAIR[c.s];
          if(st.mode==='hokm'&&pairS===st.trump)continue;
          const r=ORD_PLAIN.indexOf(c.r);
          if(r>bestRank){bestRank=r;want=c.s;}
        }
        if(want){
          const pairS=SUITPAIR[want];
          const cand=legal.filter(x=>x.s===pairS&&!isT(x)&&!myMaster(x));
          if(cand.length){cand.sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
            return{c:cand[0],why:'تحميل بإشارة'};}
        }
      }
      // 3) تحميل قيمة: بنك Q/K الميتة على لمّة الشريك المضمونة
      //    Q من لون قصير (≤3)، K من لون قصير جدًا (≤2) — الطوال تُحفظ للترقية (تصحيح d3)
      {
        const slenV=s=>st.hands[seat].filter(x=>x.s===s).length;
        const cand=legal.filter(c=>{
          if(isT(c)||myMaster(c)||inSeqRun(c))return false;
          if(c.r==='Q')return slenV(c.s)<=3;
          if(c.r==='K')return slenV(c.s)<=2;
          return false;
        });
        if(cand.length){cand.sort((a,b)=>val(b)-val(a)||ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
          return{c:cand[0],why:'تحميل نقاط للشريك'};}
      }
      // 4) خردة مدروسة
      return{c:junkPick(legal),why:'رمية محايدة'};
    }
    // partner ahead but NOT safe: take over with my own in-suit master if I have one
    {
      const takers=legal.filter(c=>c.s===lead&&!isT(c)&&myMaster(c)&&simStr(st.mode,st.trump,lead,c)>wstr);
      if(takers.length){takers.sort((a,b)=>ORD_PLAIN.indexOf(b.r)-ORD_PLAIN.indexOf(a.r));
        return{c:takers[0],why:'أخذ بالماستر لضمان اللمة'};}
    }
    if(voidLead){const sd=signalDiscard(legal);if(sd)return{c:sd,why:'إشارة للشريك'};}
    return{c:lowestSafe(legal),why:'الشريك متقدم — رمية صغيرة'};
  }
  // opponent currently winning -------------------------------------------------
  // قص اللمّة الثمينة: بأصغر حكم مضمون (لا يعلوه شيء)، وإلا بأكبر حكمي؛ الرخيصة بأصغر قص
  if(st.mode==='hokm'&&voidLead&&legal.length&&legal.every(c=>c.s===st.trump)&&pos<3&&trickPts>=10){
    const byT=legal.slice().sort((a,b)=>ORD_TRUMP.indexOf(a.r)-ORD_TRUMP.indexOf(b.r));
    const safe=byT.filter(c=>outHigher(c)===0);
    if(safe.length)return{c:safe[0],why:'قص مضمون للمّة الثمينة'};
    return{c:byT[byT.length-1],why:'قص كبير للمّة الثمينة'};
  }
  const wins=legal.filter(c=>simStr(st.mode,st.trump,lead,c)>wstr);
  if(wins.length){
    wins.sort((a,b)=>simStr(st.mode,st.trump,lead,a)-simStr(st.mode,st.trump,lead,b));
    if(pos===3){
      // all my winning options are top cards → bank the biggest (11 before 10)
      if(wins.every(c=>myMaster(c))){
        const big=wins.slice().sort((a,b)=>val(b)-val(a)||simStr(st.mode,st.trump,lead,b)-simStr(st.mode,st.trump,lead,a));
        return{c:big[0],why:'أخذ مضمون بالأكبر'};
      }
      return{c:wins[0],why:'أخذ اللمة بأقل ورقة'};
    }
    // not last: prefer a CERTAIN win (cannot be over-beaten by the players after me)
    const certain=wins.filter(c=>{
      if(isT(c))return myMaster(c);
      if(c.s!==lead)return false;
      return myMaster(c)&&!ruffPossible(lead);});
    if(certain.length){certain.sort((a,b)=>simStr(st.mode,st.trump,lead,b)-simStr(st.mode,st.trump,lead,a));
      return{c:certain[0],why:'أخذ مضمون'};}
    // كن رخيصًا: لا تصرف ورقة ثمينة على لمّة رخيصة بفوز غير مضمون (يد ثانية أو ثالثة)
    if(pos<=2&&trickPts<10&&val(wins[0])>=3)return{c:lowestSafe(legal),why:'يد ثانية صغيرة'};
    return{c:wins[0],why:'أخذ اللمة بأقل ورقة'};
  }
  // cannot win
  if(!voidLead){
    const sameSuit=legal.slice().sort((a,b)=>val(a)-val(b)||ORD_PLAIN.indexOf(a.r)-ORD_PLAIN.indexOf(b.r));
    const nm=sameSuit.filter(c=>!myMaster(c));
    return{c:(nm.length?nm[0]:sameSuit[0]),why:'تتبّع بأصغر ورقة'};
  }

function heuristicPlay(seat){
  const legal=legalCards(seat),lead=G.trick.length?G.trick[0].card.s:null;
  let ws=null,wstr=-1;for(const p of G.trick){const st=rankStrength(p.card,lead);if(st>wstr){wstr=st;ws=p.seat;}}
  const partnerWin=ws&&TEAM[ws]===TEAM[seat];
  const val=c=>(G.mode==='hokm'&&c.s===trumpSuit())?HK_TRUMP[c.r]:SUN_VAL[c.r];
  if(!G.trick.length){
    if(G.mode==='hokm'&&G.declarer&&TEAM[seat]===TEAM[G.declarer])return declarerLead(seat,legal,val);
    if(G.mode==='sun'&&G.declarer&&TEAM[seat]===TEAM[G.declarer])return sunLead(seat,legal,val);
    const ac=legal.filter(c=>c.r==='A'&&c.s!==trumpSuit());if(ac.length)return ac[0];legal.sort((a,b)=>val(a)-val(b));return legal[0];
  }
  const wins=legal.filter(c=>rankStrength(c,lead)>wstr);
  if(partnerWin){legal.sort((a,b)=>val(b)-val(a));return legal[0];}
  if(wins.length){wins.sort((a,b)=>rankStrength(a,lead)-rankStrength(b,lead));return wins[0];}
  legal.sort((a,b)=>val(a)-val(b));return legal[0];
}
function playCard(seat,card){
  dbgSnapshot();
  if(DBG.master&&G.phase==='play')masterLog(seat,card);
  // safety: never freeze — if the card isn't in hand, pick a legal substitute
  if(!card||!G.hands[seat].some(c=>c.s===card.s&&c.r===card.r)){
    const lg=legalCards(seat);if(!lg.length)return;card=lg[0];
  }
  if(G.trick.length){const lead=G.trick[0].card.s;
    if(card.s!==lead){if(G.void)(G.void[seat]||(G.void[seat]={}))[lead]=true;
      if(card.s!==trumpSuit()&&G.signal)G.signal[seat]=card.s;}}
  const h=G.hands[seat],i=h.findIndex(c=>c.s===card.s&&c.r===card.r);if(i<0)return;h.splice(i,1);
  if(G.history)G.history.push({t:G.trickNo,seat,card:{s:card.s,r:card.r}});
  const _dag=isDag(seat,card);
  G.trick.push({seat,card});checkBaloot(seat,card);
  renderPlay(seat,card);renderHand();renderFans();
  try{_dag?dagSound():cardSlap();}catch(e){}
  if(G.trickNo===1&&!G.announced[seat]){G.announced[seat]=true;
    const list=declaredList(seat);
    if(list.length){const txt=list.length>1?list.map(x=>x.name).join(' + '):list[0].name;
      setTimeout(()=>bubble(seat,txt,1200),120);}}
  if(G.trickNo>=2&&G.ownerProjects&&G.ownerProjects[seat]&&!G.projShown[seat]){
    G.projShown[seat]=true;G._justShownSeat=seat;
    setTimeout(()=>{renderProjects();renderBadges();G._justShownSeat=null;
      scheduleProjHide(seat);},220);
  }
  if(G.trick.length===4){setActive(null);const g=DBG.gen||0;setTimeout(()=>{if((DBG.gen||0)===g)resolveTrick();},750);}
  else{G.turn=nextSeat(G.turn);playStep();}
}
function scheduleProjHide(seat){
  // projects stay up for 6s, then the cards gather together and disappear
  const g=(DBG.gen||0), hid=G.handId;
  setTimeout(()=>{
    if((DBG.gen||0)!==g||G.handId!==hid)return;          // hand changed / undo → skip
    const box=el('proj-'+P(seat)); if(!box)return;
    const cards=box.querySelectorAll('.card');
    if(!cards.length){G.projHidden=G.projHidden||{};G.projHidden[seat]=true;return;}
    // 1) gather: every card slides onto the middle one
    const mid=(cards.length-1)/2;
    cards.forEach((c,i)=>{
      c.style.transition='transform .45s cubic-bezier(.4,0,.2,1), opacity .35s ease .35s';
      const base=c.style.transform||'';
      c.style.transform=base+' translateX('+((mid-i)*22).toFixed(1)+'px)';
    });
    // 2) then the whole stack fades out
    setTimeout(()=>{
      if((DBG.gen||0)!==g||G.handId!==hid)return;
      box.style.transition='opacity .4s ease, transform .4s ease';
      box.style.opacity='0';box.style.transform=(box.style.transform||'')+' scale(.82)';
      setTimeout(()=>{
        if((DBG.gen||0)!==g||G.handId!==hid)return;
        G.projHidden=G.projHidden||{};G.projHidden[seat]=true;
        box.innerHTML='';box.style.opacity='';box.style.transition='';box.style.transform='';
        G._projSig=null;                       // invalidate cache so the redraw happens
        try{renderProjects();renderBadges();}catch(e){}
      },430);
    },460);
  },6000);
}
function checkBaloot(seat,card){
  if(G.mode!=='hokm'||card.s!==G.trump||(card.r!=='K'&&card.r!=='Q'))return;
  G._kq[seat]=(G._kq[seat]||0)+1;
  if(G._kq[seat]===2&&!G.baloot.declared){G.baloot.declared=true;G.baloot.team=TEAM[seat];bubble(seat,'بلوت!',1200);setTimeout(()=>toast('بلوت','+٢٠'),300);}
}
function resolveTrick(){
  if(!G.trick.length)return;
  const lead=G.trick[0].card.s;let ws=null,wstr=-1;
  for(const p of G.trick){const st=rankStrength(p.card,lead);if(st>wstr){wstr=st;ws=p.seat;}}
  G.tricksWon[TEAM[ws]].push(...G.trick.map(p=>p.card));G.lastTrickWinner=ws;
  try{if(G.history)G.history.push({t:G.trickNo,win:ws});bubble(ws,'✓',650);}catch(e){trapErr('resolve-fx: '+e.message,'',0,0,e);}
  const cont=()=>{
    try{clearPlays();}catch(e){}
    G.trick=[];G.turn=ws;
    const rem=G.hands.S.length+G.hands.E.length+G.hands.N.length+G.hands.W.length;
    if(rem===0){setTimeout(scoreHand,450);return;}
    G.trickNo++;
    try{if(G.trickNo===2)computeProjectWinner();}catch(e){trapErr('projWinner: '+e.message,'',0,0,e);}
    try{renderBadges();}catch(e){}
    setTimeout(playStep,260);
  };
  try{collectTrick(ws,cont);}
  catch(e){trapErr('collect: '+e.message,'',0,0,e);cont();}
}
function collectTrick(ws,done){
  const t=el('seat-'+P(ws)).getBoundingClientRect();
  const tx=t.left+t.width/2, ty=t.top+t.height/2;
  let any=false;
  for(const s of SEATS){
    const card=el('play-'+s).firstChild;if(!card)continue;any=true;
    const r=card.getBoundingClientRect();
    const dx=tx-(r.left+r.width/2), dy=ty-(r.top+r.height/2);
    card.style.transition='transform .45s cubic-bezier(.45,.6,.3,1), opacity .4s ease-in .12s';
    card.style.transform='translate('+dx+'px,'+dy+'px) scale(.4) rotate(10deg)';
    card.style.opacity='0';
  }
  setTimeout(done, any?470:0);
}

/* ---------- scoring ---------- */
function cardPts(c){return(G.mode==='hokm'&&c.s===trumpSuit())?HK_TRUMP[c.r]:SUN_VAL[c.r];}
function scoreHand(){
  let raw={0:0,1:0};for(const t of[0,1])for(const c of G.tricksWon[t])raw[t]+=cardPts(c);
  const eats={0:raw[0],1:raw[1]};                       // الأكلات قبل نقاط الأرض
  const landTeam=TEAM[G.lastTrickWinner];
  raw[landTeam]+=10;
  const POOL=G.mode==='sun'?26:16;let units={0:0,1:0};
  if(G.mode==='sun'){units[0]=Math.round(raw[0]*2/10);units[1]=POOL-units[0];}
  else{units[0]=Math.round(raw[0]/10);units[1]=POOL-units[0];}
  const projU={0:0,1:0};
  if(G.projectWinner!==null&&G.tricksWon[G.projectWinner].length>0)projU[G.projectWinner]=Math.round(G.projectPoints/10);
  const bal={0:0,1:0};if(G.baloot.declared)bal[G.baloot.team]+=2;
  // الأبناط الحقيقية = الأكلات + الأرض + المشاريع + البلوت (بالنقاط)
  const projPts={0:0,1:0};
  if(G.projectWinner!==null&&G.tricksWon[G.projectWinner].length>0)projPts[G.projectWinner]=G.projectPoints;
  const balPts={0:0,1:0};if(G.baloot.declared)balPts[G.baloot.team]=20;
  const tot={0:raw[0]+projPts[0]+balPts[0],1:raw[1]+projPts[1]+balPts[1]};
  const d=TEAM[G.declarer],o=d^1;let board={0:0,1:0};
  const totD=units[d]+projU[d]+bal[d], totO=units[o]+projU[o]+bal[o];
  const DB=(G.dbl&&G.dbl.level)?G.dbl:null;
  if(DB){
    // مدبولة: الفائز بالأبناط يأخذ كل شيء مضاعفًا، والخاسر صفر. التعادل يُخسِر المدبِّل.
    const mult=DBL_MULT[DB.level]||2;
    let w = tot[0]>tot[1]?0 : tot[1]>tot[0]?1 : (DB.byTeam^1);
    board[w]=POOL*mult + projU[w]*mult + bal[w];   // المشاريع تُضاعف، البلوت لا يُضاعف
    board[w^1]=0;
    G._dblResult={mult,w,level:DB.level};
    if(DB.level==='gahwa'){                        // قهوة: الفائز يصل ١٥٢ فورًا
      const cur=(w===0?MATCH.us:MATCH.them);
      board[w]=Math.max(board[w],152-cur);
    }
    toast(DBL_AR[DB.level]+'!',(w===0?'لنا':'لهم')+' تأخذ كل شيء');
  } else if(totD<=totO){
    board[o]=POOL+projU[0]+projU[1]+bal[0]+bal[1];board[d]=0;
    toast('خسارة!',(o===0?'لنا':'لهم')+' تأخذ القبضة');
  }else{board[0]=units[0]+projU[0]+bal[0];board[1]=units[1]+projU[1]+bal[1];}
  MATCH.us+=board[0];MATCH.them+=board[1];updateScores();
  const baytah=(totD<=totO);
  setTimeout(()=>showHandResult(raw,units,projU,bal,board,{eats,landTeam,baytah,tot,projPts,balPts}),700);
}

      <td class="num">${pw===0?G.projectPoints:''}</td><td class="num">${pw===1?G.projectPoints:''}</td></tr>`;
  }
  if(bal[0]||bal[1])rows+=row('بلوت',bal[0]?20:'',bal[1]?20:'');

  el('sheet').innerHTML=`
    <style>

    <table class="rsum"><thead><tr><td></td><td class="num">لنا</td><td class="num">لهم</td></tr></thead>

/* ---------- bid UI + actions ---------- */
function clearActions(){const a=el('actionbar');a.innerHTML='<div class="ab-idle">لا توجد إجراءات الآن</div>';}
function actBtn(label,cls,cb){const _i=el('actionbar').querySelector('.ab-idle');if(_i)_i.remove();const b=document.createElement('button');b.className='abtn '+(cls||'');b.innerHTML=label;b.onclick=cb;el('actionbar').appendChild(b);return b;}
function suitLabel(su){return `حكم <span class="${RED[su]?'rs':''}">${SUIT_SYM[su]}</span>`;}
/* ---------- الاختيار المسبق للشراء ---------- */
function bidStillValid(b){
  if(!b)return false;
  const cur=G.curBid, curRank=bidRank(cur);
  if(b.type==='pass')return true;
  if(b.type==='double')return canDoubleNow(VIEW);
  if(b.type==='sun'){
    if(curRank>=2)return false;
    if(b.ashkal)return !!(cur&&cur.type==='hokm'&&canAshkal(VIEW));
    return true;
  }
  if(b.type==='hokm'){
    if(curRank>=1)return false;
    if(G.bidRound===1)return b.suit===G.buyer.s;
    return true;
  }
  return false;
}
function setPreBid(b){
  G.preBid=(G.preBid&&JSON.stringify(G.preBid)===JSON.stringify(b))?null:b;
  showPreBidUI();
}
function preLabel(b){
  if(!b)return '';
  if(b.type==='pass')return 'بس';
  if(b.type==='double')return 'دبل';
  if(b.type==='sun')return b.ashkal?'أشكل':'صن';
  if(b.type==='hokm')return b.suit?suitLabel(b.suit):'حكم ثاني';
  return '';
}
function preOpt(label,b){
  const on=G.preBid&&JSON.stringify(G.preBid)===JSON.stringify(b);
  const btn=actBtn(label,on?'gold':'ghost',()=>setPreBid(b));
  btn.classList.add('pre');
  if(on)btn.classList.add('pre-on');
  return btn;
}
function showPreBidUI(){
  if(G.phase!=='bid'||G.turn===VIEW)return;
  clearActions();
  const tag=document.createElement('div');
  tag.className='ab-pre-tag';
  tag.textContent=G.preBid?('اخترت مسبقًا: '+preLabel(G.preBid)):'اختر مسبقًا (ينفَّذ عند دورك)';
  el('actionbar').appendChild(tag);
  const cur=G.curBid, curRank=bidRank(cur), bs=G.buyer.s;
  if(curRank<2){
    preOpt('صن',{type:'sun'});
    if(cur&&cur.type==='hokm'&&canAshkal(VIEW))preOpt('أشكل',{type:'sun',ashkal:true});
  }
  if(curRank<1){
    if(G.bidRound===1)preOpt(suitLabel(bs),{type:'hokm',suit:bs});
    else preOpt('حكم ثاني',{type:'hokm',suit:null});
  }
  if(canDoubleNow(VIEW))preOpt('دبل',{type:'double'});
  preOpt(G.dealer===VIEW?(G.bidRound===1?'ثاني':'ورق'):(G.bidRound===1?'بس':'ولا'),{type:'pass'});
}
function showBidUI(){
  clearActions();
  const cur=G.curBid, curRank=bidRank(cur), bs=G.buyer.s;
  if(!cur){
    // open the round
    actBtn('صن','gold',()=>doBid({type:'sun'}));
    if(G.bidRound===1) actBtn(suitLabel(bs),'',()=>doBid({type:'hokm',suit:bs}));
    else               actBtn('حكم ثاني','',()=>doBid({type:'hokm',suit:null}));
    actBtn(G.dealer===VIEW?(G.bidRound===1?'ثاني':'ورق'):(G.bidRound===1?'بس':'ولا'),'ghost',()=>doBid({type:'pass'}));
  } else if(curRank<2){
    // a hokm contract stands → break with صن (own) or أشكل (الأرض للشريك) — or double it
    actBtn('صن','gold',()=>doBid({type:'sun'}));
    if(canAshkal(VIEW))actBtn('أشكل','gold',()=>doBid({type:'sun',ashkal:true}));
    if(canDoubleNow(VIEW))actBtn('دبل','gold',()=>doBid({type:'double'}));
    actBtn('بس','ghost',()=>doBid({type:'pass'}));
  } else {
    if(canDoubleNow(VIEW))actBtn('دبل','gold',()=>doBid({type:'double'}));
    actBtn('بس','ghost',()=>doBid({type:'pass'})); // sun stands, nothing beats it
  }
}

function highlightPlayable(){

function lowerSelected(){G.selCard=null;document.querySelectorAll('#hand .card.lift').forEach(x=>x.classList.remove('lift'));}
function renderHand(){
  if(G.arrange){renderArrange();return;}
  const w=el('hand');w.innerHTML='';w.style.position='';
  if(!G.manualOrder) sortHand(VIEW);
  const n=G.hands[VIEW].length, center=(n-1)/2;
  const sc=HANDCFG.scale||1, ov=(HANDCFG.overlap==null?0.4:HANDCFG.overlap), tilt=(HANDCFG.tilt==null?4.5:HANDCFG.tilt), hrot=HANDCFG.rot||0;
  const w0=Math.round(66*sc), h0=Math.round(100*sc), fs=(19*sc).toFixed(1), mg=Math.round(w0*ov), arc=tilt*0.2667;
  w.style.transformOrigin='50% 100%'; w.style.transform=hrot?('rotate('+hrot+'deg)'):'';
  const opening=!!G.justDealt; G.justDealt=false; G.selCard=null;
  G.hands[VIEW].forEach((c,i)=>{
    const d=cardEl(c,true);d.dataset.id=c.s+c.r;
    d.style.width=w0+'px';d.style.height=h0+'px';d.style.fontSize=fs+'px';
    d.style.marginLeft = i===0 ? '0' : (-mg)+'px';
    const off=i-center;
    if(opening){
      d.style.setProperty('--rot','0deg');d.style.setProperty('--arcY','0px');
      d.style.transition='transform .5s cubic-bezier(.2,.85,.3,1)';
      d.style.transitionDelay=(i*40)+'ms';
    } else {
      d.style.setProperty('--rot',(off*tilt).toFixed(2)+'deg');
      d.style.setProperty('--arcY',(off*off*arc*sc).toFixed(1)+'px');
    }
    d.style.zIndex=i+1;
    d.onclick=(ev)=>{
      ev.stopPropagation();
      if(G.phase!=='play'||G.turn!==VIEW)return;
      if(!legalCards(VIEW).find(x=>x.s===c.s&&x.r===c.r)){lowerSelected();return;}
      const id=c.s+c.r;
      if(G.selCard===id){
        G.selCard=null;
        if(G.trickNo===1&&!G.declaredDone[VIEW]){
          if(G.projPick&&Object.keys(G.projPick).some(k=>G.projPick[k]))confirmProjects();
          else{G.declared[VIEW]=[];G.declaredDone[VIEW]=true;}
          clearActions();}
        playCard(VIEW,c);
      } else {
        G.selCard=id;
        document.querySelectorAll('#hand .card').forEach(x=>x.classList.toggle('lift',x.dataset.id===id));
      }
    };
    w.appendChild(d);
  });
  if(opening){
    void w.offsetWidth;

function renderArrange(){

  const nodes=[];

    const d=cardEl(c,true);d.classList.add('arrcard');

  });

function attachDrag(d){
  let dragging=false,startX=0,baseLeft=0,idx=0;
  const X=e=>e.touches?e.touches[0].clientX:e.clientX;
  const move=e=>{
    if(!dragging)return; e.preventDefault();
    const dx=X(e)-startX, A=G._arr;
    d.style.left=(baseLeft+dx)+'px';
    let t=Math.round((baseLeft+dx-A.offsetX)/A.slotW);
    t=Math.max(0,Math.min(A.nodes.length-1,t));
    if(t!==idx){
      const cards=G.hands[VIEW];const[m]=cards.splice(idx,1);cards.splice(t,0,m);
      const[nm]=A.nodes.splice(idx,1);A.nodes.splice(t,0,nm);
      idx=t;
      A.nodes.forEach((node,j)=>{node.dataset.idx=j;if(node!==d){node.style.transition='left .15s';node.style.left=(A.offsetX+j*A.slotW)+'px';}});
    }
  };
  const up=()=>{
    if(!dragging)return; dragging=false; const A=G._arr;
    d.style.transition='left .15s';d.style.left=(A.offsetX+idx*A.slotW)+'px';
    d.style.zIndex='';d.classList.remove('dragging');
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
  };
  const down=e=>{
    if(!G.arrange)return; e.preventDefault();
    dragging=true; idx=+d.dataset.idx; startX=X(e); baseLeft=parseFloat(d.style.left);
    d.style.transition='none';d.style.zIndex=999;d.classList.add('dragging');
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  };
  d.addEventListener('touchstart',down,{passive:false});
  d.addEventListener('mousedown',down);
}

function renderProjects(){

function selectProj(s){SELPROJ=s;for(const x of SEATS){const b=el('proj-'+x);if(b)b.classList.toggle('selp',x===s);}updateProjBtn();}
function updateProjBtn(){const b=el('proj-sel');if(!b)return;
  b.textContent = SELPROJ ? ('مشروع ('+SEAT_SHORT[SELPROJ]+')') : 'اختر مشروع';}
function loadLayout(){try{const o=JSON.parse(localStorage.getItem(LKEY));return (o&&Object.keys(o).length)?o:JSON.parse(JSON.stringify(DEFAULT_LAYOUT));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_LAYOUT));}}
function saveLayout(){const m={};document.querySelectorAll('.movable').forEach(el=>{if(el._dx||el._dy)m[el.id]={dx:Math.round(el._dx),dy:Math.round(el._dy)};});try{localStorage.setItem(LKEY,JSON.stringify(m));}catch(e){}}
function ensureBase(el){if(el._base===undefined){const t=getComputedStyle(el).transform;el._base=(t&&t!=='none')?t:'';}}
function setT(el){el.style.transform='translate('+(el._dx||0)+'px,'+(el._dy||0)+'px) '+(el._base||'');}
function applyLayout(){document.querySelectorAll('.movable').forEach(el=>{ensureBase(el);const o=LAYOUT[el.id];el._dx=o?o.dx:0;el._dy=o?o.dy:0;if(el._dx||el._dy)setT(el);});}
function makeDraggable(el){
  let on=false,sx=0,sy=0,bx=0,by=0;
  const P=e=>e.touches?e.touches[0]:e;
  const move=e=>{if(!on)return;e.preventDefault();const p=P(e);el._dx=bx+(p.clientX-sx);el._dy=by+(p.clientY-sy);setT(el);};
  const up=()=>{if(!on)return;on=false;el.classList.remove('moving');
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
  const down=e=>{if(!document.body.classList.contains('editing'))return;e.preventDefault();e.stopPropagation();
    if(el.id&&el.id.indexOf('proj-')===0)selectProj(el.id.slice(5));
    ensureBase(el);on=true;const p=P(e);sx=p.clientX;sy=p.clientY;bx=el._dx||0;by=el._dy||0;el.classList.add('moving');
    document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);};
  el.addEventListener('touchstart',down,{passive:false});el.addEventListener('mousedown',down);
}
function initLayoutEditor(){
  LAYOUT=loadLayout();loadProj();loadHand();loadBuyer();loadSlap();buildSlapPicker();updateProjBtn();syncSndIcon();
  document.addEventListener('click',(e)=>{const w=e.target.closest&&e.target.closest('.tb-snd');if(!w)hideSlapMenu();});
  MOVABLE.forEach(id=>{const el=document.getElementById(id);if(el){el.classList.add('movable');makeDraggable(el);}});
  applyLayout();
}
function renderPlayEdit(){
  const editing=document.body.classList.contains('editing');
  if(editing){
    const demo={N:{s:'spades',r:'A'},E:{s:'hearts',r:'K'},W:{s:'diamonds',r:'10'},S:{s:'clubs',r:'Q'}};
    for(const s of SEATS){const slot=el('play-'+s);if(!slot)continue;slot.innerHTML='';slot.appendChild(cardEl(demo[s],true));}
  } else {
    clearPlays();
    if(G&&G.trick)for(const p of G.trick)renderPlay(p.seat,p.card);
  }
}
function exportLayout(){
  const layout={};
  document.querySelectorAll('.movable').forEach(el=>{if(el._dx||el._dy)layout[el.id]={dx:Math.round(el._dx),dy:Math.round(el._dy)};});
  return JSON.stringify({layout,proj:PROJCFG,hand:HANDCFG,buyer:BUYERCFG});
}
function copyLayout(){
  const data=exportLayout();
  const ok=()=>toast('تم نسخ التصميم','الصقه للمطوّر ليثبّته');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(ok).catch(()=>window.prompt('انسخ التصميم:',data));return;} }catch(e){}
  window.prompt('انسخ التصميم:',data);
}
function toggleEdit(){
  const b=document.body;
  if(b.classList.contains('editing')){b.classList.remove('editing');saveLayout();saveProj();toast('تم اعتماد التصميم');}
  else{b.classList.add('editing');SELPROJ=null;updateProjBtn();toast('حرّك العناصر','اختر مكان المشروع لتغيّر حجمه واتجاهه');}
  renderProjects();renderPlayEdit();
}
function resetLayout(){
  LAYOUT={};document.querySelectorAll('.movable').forEach(el=>{el._dx=0;el._dy=0;el.style.transform=el._base||'';});
  try{localStorage.removeItem(LKEY);}catch(e){}toast('رجع التصميم للأصل');
}
window.addEventListener('load',()=>{
  el('arrange-btn').onclick=toggleArrange;
  // unlock audio on the first real user gesture (required by iOS Safari)
  (function(){
    const fire=()=>{unlockAudio();
      document.removeEventListener('touchstart',fire,true);
      document.removeEventListener('pointerdown',fire,true);
      document.removeEventListener('click',fire,true);};
    document.addEventListener('touchstart',fire,true);
    document.addEventListener('pointerdown',fire,true);
    document.addEventListener('click',fire,true);
  })();
  // triple-tap 🔊 → show audio diagnostics
  (function(){const b=el('snd-btn');if(!b)return;let n=0,t=null;
    b.addEventListener('click',()=>{n++;clearTimeout(t);
      t=setTimeout(()=>{if(n>=3){const d=window.AUDIO_DIAG||{};
        toast('تشخيص الصوت','فتح:'+d.unlock+' · سياق:'+d.ctx+' · تهيئة:'+d.prime+' · مقاطع:'+d.clips+' · آخر:'+(d.lastPlay||'-')+' · خطأ:'+(d.lastErr||'-'));}
        n=0;},700);});})();
  el('snd-btn').onclick=()=>{unlockAudio();toggleSlapMenu();};
  // long-press 🔊 → preview every announcement so the voice can be judged quickly
  (function(){
    const b=el('snd-btn');if(!b)return;let t=null;
    const start=()=>{t=setTimeout(()=>{t=null;voicePreview();},600);};
    const cancel=()=>{if(t){clearTimeout(t);t=null;}};
    b.addEventListener('pointerdown',start);
    b.addEventListener('pointerup',cancel);
    b.addEventListener('pointerleave',cancel);
    b.addEventListener('pointercancel',cancel);
  })();
  el('view-btn').onclick=()=>{const i=SEATS.indexOf(VIEW);VIEW=SEATS[(i+1)%4];toast('مقعدك: '+PLATE[VIEW].nm,'منظور جديد — توزيع جديد');startHand();};
