      let lp=null,moved=false;
      const startLP=()=>{moved=false;clearTimeout(lp);
        lp=setTimeout(()=>{moved=true;rc=(rc+1)%RUGS.length;applyRug();
          toast('نقشة الفرشة: '+RUGN[RUGS[rc]],'استمر بالضغط للتبديل');},450);};
      const endLP=()=>{clearTimeout(lp);};
      v.addEventListener('touchstart',startLP,{passive:true});
      v.addEventListener('touchend',endLP);
      v.addEventListener('touchmove',endLP,{passive:true});
      v.addEventListener('mousedown',startLP);
      v.addEventListener('mouseup',endLP);
      v.addEventListener('mouseleave',endLP);
      const oldClick=v.onclick;
      v.onclick=(e)=>{if(moved){moved=false;return;}oldClick&&oldClick(e);};
    }
  })();
  el('dbg-btn').onclick=()=>{DBG.on=!DBG.on;if(!DBG.on){DBG.reveal=false;DBG.paused=false;}dbgBar();renderFans();toast(DBG.on?'وضع التدقيق 🐞':'إيقاف التدقيق','');if(DBG.on===false&&G.phase==='play')playStep();};
  el('layout-btn').onclick=toggleEdit;
  // draggable design toolbar (✥ grip), position persisted
  (function(){
    const b=el('editbar');if(!b)return;
    try{const p=JSON.parse(localStorage.getItem('baloot_editbar')||'null');
      if(p&&p.l!=null){b.style.left=p.l+'px';b.style.top=p.t+'px';b.style.transform='none';}}catch(e){}
    let drag=null;
    b.addEventListener('pointerdown',ev=>{
      if(ev.target.id!=='eb-grip')return;
      const r=b.getBoundingClientRect();
      drag={dx:ev.clientX-r.left,dy:ev.clientY-r.top};
      b.setPointerCapture(ev.pointerId);ev.preventDefault();
    });
    b.addEventListener('pointermove',ev=>{
      if(!drag)return;
      b.style.transform='none';
      let l=ev.clientX-drag.dx, t=ev.clientY-drag.dy;
      l=Math.max(0,Math.min(window.innerWidth-b.offsetWidth,l));
      t=Math.max(0,Math.min(window.innerHeight-b.offsetHeight,t));
      b.style.left=l+'px';b.style.top=t+'px';
    });
    const endD=()=>{if(!drag)return;drag=null;
      try{localStorage.setItem('baloot_editbar',JSON.stringify({l:parseInt(b.style.left)||0,t:parseInt(b.style.top)||0}));}catch(e){}};
    b.addEventListener('pointerup',endD);b.addEventListener('pointercancel',endD);
  })();
  el('edit-done').onclick=toggleEdit;
  el('edit-copy').onclick=copyLayout;
  el('floor-btn').onclick=toggleFloor;
  el('back-btn').onclick=nextBack;
  el('buyer-minus').onclick=()=>{BUYERCFG.scale=Math.max(0.6,+((BUYERCFG.scale||1)-0.1).toFixed(2));saveBuyer();applyBuyerScale();};
  el('buyer-plus').onclick=()=>{BUYERCFG.scale=Math.min(2.6,+((BUYERCFG.scale||1)+0.1).toFixed(2));saveBuyer();applyBuyerScale();};
  el('hand-minus').onclick=()=>{HANDCFG.scale=Math.max(0.7,+(HANDCFG.scale-0.1).toFixed(2));saveHand();renderHand();};
  el('hand-plus').onclick=()=>{HANDCFG.scale=Math.min(1.7,+(HANDCFG.scale+0.1).toFixed(2));saveHand();renderHand();};
  el('hand-close').onclick=()=>{HANDCFG.overlap=Math.min(0.85,+(((HANDCFG.overlap??0.4))+0.06).toFixed(2));saveHand();renderHand();};
  el('hand-spread').onclick=()=>{HANDCFG.overlap=Math.max(0.1,+(((HANDCFG.overlap??0.4))-0.06).toFixed(2));saveHand();renderHand();};
  el('hand-tiltp').onclick=()=>{HANDCFG.tilt=Math.min(14,+(((HANDCFG.tilt??4.5))+1).toFixed(1));saveHand();renderHand();};
  el('hand-tiltm').onclick=()=>{HANDCFG.tilt=Math.max(0,+(((HANDCFG.tilt??4.5))-1).toFixed(1));saveHand();renderHand();};
  el('hand-rotp').onclick=()=>{HANDCFG.rot=(((HANDCFG.rot??0)+5+180+360)%360)-180;saveHand();renderHand();};
  el('hand-rotm').onclick=()=>{HANDCFG.rot=(((HANDCFG.rot??0)-5+180+360)%360)-180;saveHand();renderHand();};
  el('app').addEventListener('click',(e)=>{if(G.selCard&&!e.target.closest('#hand .card'))lowerSelected();});
  el('edit-reset').onclick=resetLayout;
  const needSel=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return false;}return true;};
  el('proj-close').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].overlap=Math.min(0.85,+(((PROJCFG[SELPROJ].overlap??0.5))+0.07).toFixed(2));renderProjects();saveProj();};
  el('proj-spread').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].overlap=Math.max(0.0,+(((PROJCFG[SELPROJ].overlap??0.5))-0.07).toFixed(2));renderProjects();saveProj();};
  el('proj-tiltp').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].tilt=Math.min(22,(PROJCFG[SELPROJ].tilt??9)+2);renderProjects();saveProj();};
  el('proj-tiltm').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].tilt=Math.max(0,(PROJCFG[SELPROJ].tilt??9)-2);renderProjects();saveProj();};
  el('proj-rotp').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].rot=(((PROJCFG[SELPROJ].rot??0)+5+180+360)%360)-180;renderProjects();saveProj();};
  el('proj-rotm').onclick=()=>{if(!needSel())return;PROJCFG[SELPROJ].rot=(((PROJCFG[SELPROJ].rot??0)-5+180+360)%360)-180;renderProjects();saveProj();};
  el('proj-plus').onclick=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return;}PROJCFG[SELPROJ].scale=Math.min(2.2,+(PROJCFG[SELPROJ].scale+0.15).toFixed(2));renderProjects();saveProj();};
  el('proj-minus').onclick=()=>{if(!SELPROJ){toast('اختر مكان مشروع أولاً');return;}PROJCFG[SELPROJ].scale=Math.max(0.6,+(PROJCFG[SELPROJ].scale-0.15).toFixed(2));renderProjects();saveProj();};
  updateScores();startHand();
  setTimeout(initLayoutEditor,60);
});
</script>
</body>
</html>
